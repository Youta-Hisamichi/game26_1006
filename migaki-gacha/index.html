<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a1f">
  <title>磨きガチャ</title>
  <meta name="description" content="泥だらけの水晶玉を磨くと、中から宝石が出てくる。図鑑を集めよう。">
  <meta property="og:title" content="磨きガチャ">
  <meta property="og:description" content="泥だらけの水晶玉を磨いて、宝石を磨き出そう。磨き方にはクセがあるかも…？">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>磨きガチャ</h1>
    <p class="lead">泥だらけの水晶玉をこすって、宝石を磨き出そう。</p>
  </header>

  <section class="scorebar" aria-label="スコア">
    <div class="sbox main"><span class="label">TOTAL SCORE</span><b id="total">0</b></div>
    <div class="sbox"><span class="label">図鑑</span><b id="dexCount">0/0</b></div>
    <div class="sbox"><span class="label">磨いた数</span><b id="polishCount">0</b></div>
    <button id="mute" class="icon-btn" type="button" aria-label="サウンド切り替え">🔊</button>
  </section>

  <section class="stage" id="stage" aria-label="ゲーム画面">
    <div class="ball" id="ball">
      <div class="shape" id="shape">
        <div class="ball-inner" id="ballInner">
          <div class="tease tease-n" id="tease"></div>
          <div class="core" id="core"></div>
          <div class="gem-slot" id="gemSlot"></div>
        </div>
        <canvas id="mud"></canvas>
        <div class="glass"></div>
        <svg class="rim" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon id="rimPoly" points=""/></svg>
      </div>
      <div class="rays" id="rays"></div>
      <div class="prompt" id="prompt">なぞって<br>磨こう</div>
    </div>
    <div class="pedestal"></div>
    <div class="flash" id="flash"></div>
    <canvas id="fx"></canvas>

    <div class="dock">
      <div class="hud" id="hud">
        <div class="hud-msg" id="msg">水晶玉をなぞって磨こう</div>
        <div class="bar"><i id="bar"></i></div>
        <div class="hud-sub">磨き方で、出やすい宝石が変わるかも…？</div>
      </div>
      <div class="result" id="result" hidden>
        <div class="res-top">
          <span class="rb"><span class="badge" id="rBadge">N</span><span class="stars" id="rStars"></span></span>
          <b class="res-name" id="rName"></b>
          <span class="new" id="rNew">NEW!</span>
        </div>
        <div class="res-mid">
          <span class="res-score">+<b id="rScore">0</b> pt</span>
          <span class="res-prob" id="rProb"></span>
          <span class="res-style" id="rStyle"></span>
        </div>
        <button class="btn primary wide" id="nextBtn" type="button">つぎの水晶玉を磨く</button>
      </div>
    </div>
  </section>

  <section class="share" id="shareRow" aria-label="シェア">
    <div class="share-head">
      <img id="shareThumb" alt="シェア用画像" width="64" height="64">
      <div><b>シェア</b><small id="shareNote">画像つきで投稿できます</small></div>
    </div>
    <div class="share-grid">
      <button class="btn primary all" id="allBtn" type="button">シェア先を一覧から選ぶ</button>
      <a class="btn s-x" id="xBtn" target="_blank" rel="noopener" href="#">𝕏</a>
      <a class="btn s-line" id="lineBtn" target="_blank" rel="noopener" href="#">LINE</a>
      <a class="btn s-fb" id="fbBtn" target="_blank" rel="noopener" href="#">Facebook</a>
      <a class="btn s-bsky" id="bskyBtn" target="_blank" rel="noopener" href="#">Bluesky</a>
      <a class="btn s-th" id="thBtn" target="_blank" rel="noopener" href="#">Threads</a>
      <button class="btn" id="imgCopyBtn" type="button">画像コピー</button>
      <a class="btn" id="imgSaveBtn" download="migaki-gacha.png" href="#">画像保存</a>
      <button class="btn" id="copyBtn" type="button">文章コピー</button>
    </div>
  </section>

  <section class="rank" id="rankSec" aria-label="ランキング" hidden>
    <h2>ランキング</h2>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="total" type="button">スコア順</button>
      <button class="tab" data-tab="dex" type="button">図鑑順</button>
    </div>
    <ol class="rank-list" id="rankList"></ol>
    <p class="rank-note" id="rankNote"></p>
  </section>

  <section class="codex" aria-label="宝石図鑑">
    <h2>宝石図鑑</h2>
    <div id="codex"></div>
  </section>

  <footer class="foot">
    <button class="link" id="resetBtn" type="button">データを消去</button>
  </footer>
</main>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="シェア先を選ぶ">
    <b>シェア先を選ぶ</b>
    <small>押すと画像をコピーして開きます。投稿画面で貼り付けてね。</small>
    <div class="sheet-grid" id="sheetGrid"></div>
    <button class="btn" id="sheetClose" type="button">閉じる</button>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="game.js"></script>
</body>
</html>
