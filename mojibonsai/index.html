<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>テキスト盆栽</title>
<meta name="description" content="好きな文字を入れると、その文字らしい盆栽がすぐ育つ。Type any text and grow a bonsai. #TextBonsai">
<meta property="og:title" content="テキスト盆栽">
<meta property="og:description" content="好きな文字を入れると、その文字らしい盆栽がすぐ育つ。たまに育たない文字も。">
<style>
:root{--bg:#f3ecdc;--ink:#2b2118;--card:#fffaf0;--accent:#b5382c;--line:#d8cbb0}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a16;--ink:#efe6d4;--card:#2a251f;--line:#443b30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:16px;position:relative}
.langbtn{position:absolute;right:16px;top:12px;padding:4px 10px;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
h1{margin:8px 0 2px;font-size:28px;letter-spacing:.3em;text-align:center}
.sub{text-align:center;font-size:13px;opacity:.7;margin:0 0 12px}
form{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
button:active{transform:translateY(1px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px;font-size:14px}
.chips span{opacity:.6;align-self:center}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:3px 11px;font-size:16px;border-radius:99px}
canvas{display:block;width:100%;aspect-ratio:640/520;border-radius:14px;border:2px solid var(--line);background:#eee;touch-action:manipulation}
#result{margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;opacity:0;transform:translateY(8px);transition:.5s}
#result.show{opacity:1;transform:none}
#result.bad{border-color:var(--accent)}
#rank{font-size:22px;font-weight:bold;margin:0}
#stars{font-size:20px;color:#d29a1b;letter-spacing:2px}
#score{font-size:14px;opacity:.7;margin-left:6px}
#comment{line-height:1.8;margin:6px 0 0}
#meta{font-size:12px;opacity:.6;margin-top:6px}
#breakdown{font-size:12px;opacity:.75;margin-top:8px}
#breakdown:empty{display:none}
#metrics{margin-top:10px;display:grid;gap:4px;font-size:12px}
#metrics:empty{display:none}
.m{display:grid;grid-template-columns:7.5em 1fr 4.5em;gap:8px;align-items:center}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.m b{text-align:right;font-weight:normal}
#share{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#share button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:7px 14px;font-size:14px}
#share .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#menu.on{display:flex}
#menu .sheet{background:var(--card);color:var(--ink);width:min(520px,100%);border-radius:16px 16px 0 0;padding:16px;display:grid;gap:10px}
#menu h3{margin:0;font-size:16px}
#menu .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
#menu a,#menu button{display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:15px}
#share .x{background:#111;color:#fff;border-color:#111}
#ver{margin:22px 0 2px;text-align:center;font-size:12px;opacity:.5}
#dev{margin:0 0 14px;text-align:center;font-size:12px}
#dev a{color:inherit;opacity:.65;text-decoration:underline}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s}
#toast.on{opacity:.92}
#hist{margin-top:14px;font-size:13px}
#hist h2{font-size:14px;margin:0 0 4px;opacity:.7}
#hist button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:3px 10px;font-size:14px;margin:0 6px 6px 0}
</style>
</head>

<form id="f">

  <button data-i="grow">育てる</button>
</form>
<div class="chips"><span data-i="try">お試し:</span></div>
<canvas id="c" width="640" height="520"></canvas>
<div id="result">

  <div><span id="stars"></span><span id="score"></span></div>
  <p id="comment"></p>
  <div id="breakdown"></div>
  <div id="metrics"></div>
  <div id="meta"></div>
  <div id="share">
    <button type="button" id="bShare" class="primary" data-i="share">シェア</button>
    <button type="button" id="bX" class="x" data-i="shareX">𝕏 でシェア</button>
    <button type="button" id="bImg" data-i="img">画像を保存</button>
    <button type="button" id="bCopy" data-i="copy">リンクをコピー</button>
  </div>
</div>
<div id="hist" hidden><h2 data-i="hist">育てた盆栽</h2><div id="histlist"></div></div>
<footer id="ver"></footer>
<div id="dev"><a href="https://x.com/Hisashi_vc" target="_blank" rel="noopener noreferrer"><span data-i="dev">開発</span>: ひさしApp</a></div>
</main>

/* ---------- 字形の分析（実際に文字を描いて測る） ---------- */
function glyphInfo(chars,target=230){
  try{
    const n=Math.min(chars.length,6),S=120,W=S*n;
    const off=document.createElement('canvas');off.width=W;off.height=S;
    const x=off.getContext('2d',{willReadFrequently:true});
    x.fillStyle='#000';x.font=`bold ${S*.86}px ${FONT}`;x.textAlign='center';x.textBaseline='middle';
    chars.slice(0,n).forEach((c,i)=>x.fillText(c,S*i+S/2,S*.54));
    const d=x.getImageData(0,0,W,S).data;
    const lit=(px,py)=>px>=0&&px<W&&py>=0&&py<S&&d[(py*W+px)*4+3]>128;
    let ink=0,sx=0,sy=0,minx=W,maxx=0,miny=S,maxy=0;
    for(let y=0;y<S;y++)for(let px=0;px<W;px++)if(lit(px,y)){ink++;sx+=px;sy+=y;if(px<minx)minx=px;if(px>maxx)maxx=px;if(y<miny)miny=y;if(y>maxy)maxy=y;}
    if(ink<60)return null;
    const bw=maxx-minx+1,bh=maxy-miny+1;
    let tot=0,match=0;const m=minx+maxx;
    for(let y=miny;y<=maxy;y+=2)for(let px=minx;px<=maxx;px+=2)if(lit(px,y)){tot++;if(lit(m-px,y)||lit(m-px+1,y)||lit(m-px-1,y))match++;}
    const step=Math.max(6,Math.ceil(Math.sqrt(bw*bh/target)));
    const pts=[];
    for(let gy=miny;gy<=maxy;gy+=step)for(let gx=minx;gx<=maxx;gx+=step){
      let c=0,t=0;for(let yy=gy;yy<gy+step;yy+=2)for(let xx=gx;xx<gx+step;xx+=2){t++;if(lit(xx,yy))c++;}
      if(c/t>=.3)pts.push({x:gx+step/2-minx-bw/2,y:gy+step/2-miny-bh/2});
    }
    return{sym:tot?match/tot:0,cx:(sx/ink-(minx+maxx)/2)/bw,cy:(sy/ink-miny)/bh,dens:ink/(bw*bh),bw,bh,step,pts};
  }catch(e){return null;}
}

function drawScore(txt,age){

  ctx.save();ctx.globalAlpha=p;ctx.textAlign='right';ctx.textBaseline='top';
  let fs=46;ctx.font=`bold ${fs}px ${FONT}`;
  while(ctx.measureText(txt).width>270&&fs>14){fs-=2;ctx.font=`bold ${fs}px ${FONT}`;}

  ctx.translate(628,14);ctx.scale(pop,pop);
  ctx.lineJoin='round';ctx.lineWidth=7;ctx.strokeStyle='rgba(255,248,230,.95)';ctx.strokeText(txt,0,0);
  ctx.fillStyle='#b5382c';ctx.fillText(txt,0,0);

}
function drawJudging(sa){

function drawStamp(st,age,seed){
  if(!st||age<0)return;
  const p=Math.min(1,age/.3),e=1-Math.pow(1-p,3);
  const sc=p<1?2.4-1.4*e:1+.06*Math.exp(-(age-.3)*7)*Math.cos((age-.3)*22);
  ctx.save();ctx.translate(98,112);ctx.rotate(-.2);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(1,p*2)*.9;
  const col=st.col;ctx.strokeStyle=col;ctx.fillStyle=col;

  ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,0,50,0,6.283);ctx.stroke();
  const en=lang==='en',lines=st.lines,ml=Math.max(...lines.map(l=>l.length));
  const fs=en?Math.min(24,Math.floor(86/(ml*.62))):Math.min(38,Math.floor(84/ml));
  ctx.font=`bold ${fs}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';

  const cnt={};g.classes.forEach(c=>cnt[c]=(cnt[c]||0)+1);
  const domc=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  let cm='';
  if(inf){

    cm+=g.bigEmo?L(`${q(T)}は、大きな${g.emo[0]}ひとつになりました。`,`${q(T)} became one giant ${g.emo[0]}.`):g.mode==='glyph'&&g.chars.length>1?L(`${g.chars.length}文字がそれぞれの字形で茂り、重なり合って複雑な樹冠になりました。`,`${g.chars.length} characters each grew in their own glyph shape and overlap into a tangled crown.`)

    :{chokkan:L(`字形の左右対称度が${sp}%と整っているため、まっすぐ天を突く直幹に育ちました。`,`With ${sp}% left-right symmetry, it grew into a perfectly upright trunk.`),
      shakan:L(`字の重心が${right?'右':'左'}に${cxp}%寄っているので、${right?'右':'左'}へ傾く斜幹になりました。`,`The glyph's center of mass sits ${cxp}% to the ${right?'right':'left'}, so the trunk leans ${right?'right':'left'}.`),

    ['777点','777 pts',mkS('大当たり賞','Jackpot',['大当たり','賞'],['JACKPOT'],'#c99a1f'),'スロットなら大当たりです。','A jackpot, slot-machine style.'],
    ['1,000点','1,000 pts',mkS('千点賞','1,000 Club',['千点賞'],['1,000','CLUB'],'#c99a1f'),'ついに4桁の大台に乗りました。','You finally broke into four digits.'],
    ['1万点','10,000 pts',mkS('万点賞','10K Club',['万点賞'],['10K','CLUB'],'#c99a1f'),'1万点！審査員がざわついています。','Ten thousand points! The judges are buzzing.'],
    ['100万点','1,000,000 pts',mkS('百万点賞','Million Club',['百万点','賞'],['MILLION','CLUB'],'#c99a1f'),'100万点。もはや盆栽の概念を超えました。','A million points. This has transcended the concept of bonsai.'],
    ['1億点','100,000,000 pts',mkS('億点賞','Hundred Million Club',['億点賞'],['100M','CLUB'],'#c99a1f'),'1億点。審査員が驚いて会場から退席しました。','One hundred million points. The judges left the venue in shock.']];
  const jw=[0,0,1,1,2,2,3,3,4,5];

function frame(now){

  ctx.setTransform(DPR,0,0,DPR,0,0);

    let t=Math.min(1,(now-start)/DURATION);

      const wd=G.fate==='wither';
      if(GOODMODES.includes(G.mode)&&parts.length<(wd?40:G.mode==='withered'?14:10)&&Math.random()<(wd?.3:.06))spawnPart(G);

function grow(text){

  const t=encodeURIComponent(shareText()),u=encodeURIComponent(shareURL()),tu=encodeURIComponent(shareText()+' '+shareURL());
  return[['𝕏','https://twitter.com/intent/tweet?text='+t+'&url='+u],
    ['LINE','https://social-plugins.line.me/lineit/share?url='+u+'&text='+t],
    ['Facebook','https://www.facebook.com/sharer/sharer.php?u='+u],
    ['Bluesky','https://bsky.app/intent/compose?text='+tu],
    ['Threads','https://www.threads.net/intent/post?text='+tu],
    ['Reddit','https://www.reddit.com/submit?url='+u+'&title='+t],
    [P(UI.mail),'mailto:?subject='+encodeURIComponent(P(UI.title))+'&body='+tu]];
}
function openMenu(){
  const g=$('menuGrid');g.textContent='';
  for(const [n,h] of shareTargets()){const a=document.createElement('a');a.textContent=n;a.href=h;a.target='_blank';a.rel='noopener noreferrer';g.appendChild(a);}
  const c=document.createElement('button');c.type='button';c.textContent=P(UI.copy);c.onclick=()=>{$('bCopy').click();closeMenu();};g.appendChild(c);
  const im=document.createElement('button');im.type='button';im.textContent=P(UI.img);im.onclick=()=>{$('bImg').click();closeMenu();};g.appendChild(im);
  $('menu').classList.add('on');
}
function closeMenu(){$('menu').classList.remove('on');}
$('menuClose').onclick=closeMenu;
$('menu').addEventListener('click',e=>{if(e.target===$('menu'))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
$('bShare').onclick=async()=>{if(!ready())return;
  if(navigator.share){
    const d={title:P(UI.title),text:shareText()+' '+shareURL()};
    try{const f=new File([await makeBlob()],'textbonsai.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))d.files=[f];else d.url=shareURL();}catch(e){d.url=shareURL();}
    try{await navigator.share(d);return;}catch(e){if(e&&e.name==='AbortError')return;}
  }
  openMenu();};

/* ---------- 言語切り替え・初期化 ---------- */
function applyLang(){
  $('ver').textContent=`${P(UI.title)}  v${VERSION}  (${BUILD})`;
  document.documentElement.lang=lang;document.title=P(UI.title);
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=P(UI[e.dataset.i]);});
  $('t').placeholder=P(UI.ph);$('lang').textContent=lang==='en'?'日本語':'EN';
  if(G){R=evaluate(G);if(shown)paintResult(G);}
}
$('lang').onclick=()=>{lang=lang==='en'?'ja':'en';try{localStorage.setItem('mojibonsai_lang',lang);}catch(e){}applyLang();};
$('f').addEventListener('submit',e=>{e.preventDefault();grow($('t').value);});
cv.addEventListener('click',()=>{if(G&&!shown){const n=performance.now();start=Math.min(start,n-DURATION);slotT0=Math.min(slotT0,n-(STAMP_AT-.3)*1000);}});
{const box=document.querySelector('.chips');
 for(const s of['桜','松','猫','火','寿','UFO','cat','gold','sakura','あ','枯','草','顔']){const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=s;b.onclick=()=>{$('t').value=s;grow(s);};box.appendChild(b);}}
{const qs=new URLSearchParams(location.search);let l=qs.get('lang');
 if(l!=='ja'&&l!=='en'){try{l=localStorage.getItem('mojibonsai_lang');}catch(e){}}
 if(l!=='ja'&&l!=='en')l=(navigator.language||'ja').toLowerCase().startsWith('ja')?'ja':'en';
 lang=l;applyLang();renderHist();
 requestAnimationFrame(n=>{last=n;frame(n);});
 const q=qs.get('t');
 if(q){$('t').value=Array.from(q).slice(0,20).join('');(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>grow(Array.from(q).slice(0,20).join('')));}}
</script>
