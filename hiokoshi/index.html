<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120d0a">
<title>火おこしRTA</title>
<style>
:root{
  --bg:#120d0a; --panel:rgba(30,18,10,.92); --ink:#f6e7cf; --mute:#b79b78;
  --fire:#ff7a1a; --fire2:#ffc84a; --line:#5a3d26; --good:#9be564;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo","WenQuanYi Zen Hei",sans-serif;
  user-select:none;-webkit-user-select:none}
body{display:flex;min-height:100dvh}
#stage{position:relative;margin:auto;display:grid;width:min(100%,max(75dvh,320px));aspect-ratio:3/4;container-type:inline-size;background:#000}
#stage>*{grid-area:1/1}
canvas#cv{align-self:start;width:100%;height:auto;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:0;right:0;top:0;padding:2.5cqw 3cqw;pointer-events:none;display:none}
#hud.on{display:block}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:2cqw}
#time{font-size:11cqw;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  text-shadow:0 .4cqw 0 #000a,0 0 3cqw #ff7a1a66}
#time small{font-size:4.5cqw;margin-left:1cqw;color:var(--mute)}
.btns{display:flex;gap:2cqw;pointer-events:auto}
.ib{width:9cqw;height:9cqw;border-radius:50%;border:.5cqw solid var(--line);background:#1e120acc;color:var(--ink);
  font-size:4.6cqw;display:grid;place-items:center;cursor:pointer;padding:0}
#gaugeWrap{margin-top:2cqw}
#gauge{position:relative;height:4.4cqw;border-radius:2.2cqw;background:#0008;border:.4cqw solid var(--line);overflow:hidden}
#gfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8a8a8a,#c98a3a 45%,#ff7a1a 75%,#ffd34d)}
#gauge i{position:absolute;top:0;bottom:0;width:.3cqw;background:#fff5}
#glabels{display:flex;margin-top:.8cqw;font-size:2.6cqw;color:var(--mute);position:relative;height:3.5cqw}
#glabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#hint{margin-top:1.5cqw;text-align:center;font-size:4cqw;font-weight:700;min-height:5cqw;color:var(--fire2);
  text-shadow:0 .3cqw 0 #000}
#combo{position:absolute;left:3cqw;top:118cqw;font-size:6cqw;font-weight:900;color:var(--good);
  text-shadow:0 .4cqw 0 #000;opacity:0;transition:opacity .15s}
#combo.on{opacity:1}
.ov{display:none;align-self:stretch;align-items:center;justify-content:center;padding:2cqw 4cqw;
  background:radial-gradient(ellipse at 50% 40%,rgba(18,10,5,.78),rgba(8,4,2,.95))}
.ov.on{display:flex}
.card{width:100%;text-align:center;padding:5cqw 0}
h1{margin:0;font-size:10cqw;line-height:1.05;font-weight:900;color:var(--fire2);
  text-shadow:0 .6cqw 0 #7a2a00,0 0 5cqw #ff7a1a88}
.sub{color:var(--mute);font-size:3.4cqw;margin:1cqw 0 2.5cqw}
.how{background:#00000055;border:.4cqw solid var(--line);border-radius:3cqw;padding:2.4cqw;
  text-align:left;font-size:3.2cqw;line-height:1.55;margin-bottom:2.5cqw}
.how b{color:var(--fire2)}
.rec{display:grid;grid-template-columns:repeat(2,1fr);gap:2cqw;margin-bottom:2.5cqw}
.rec div,.stat div{background:#00000066;border:.4cqw solid var(--line);border-radius:2.4cqw;padding:2cqw 1cqw}
.rec small,.stat small{display:block;font-size:2.8cqw;color:var(--mute)}
.rec b,.stat b{font-size:4.8cqw;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:3cqw;padding:2.6cqw;margin-top:2cqw;font:inherit;
  font-size:4.6cqw;font-weight:900;color:#2a1000;cursor:pointer;
  background:linear-gradient(#ffd34d,#ff8a1f);box-shadow:0 1cqw 0 #8a3a00,0 2cqw 4cqw #0008}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .2cqw 0 #8a3a00}
.btn.sec{background:linear-gradient(#e8d5b5,#b99a6e);box-shadow:0 1cqw 0 #5a4326,0 2cqw 4cqw #0008}
.btn.share{background:linear-gradient(#7fd6ff,#2f8fe0);color:#001a2e;box-shadow:0 1cqw 0 #124a7a,0 2cqw 4cqw #0008}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
#rank{font-size:9cqw;font-weight:900;color:var(--fire2);text-shadow:0 .5cqw 0 #7a2a00;line-height:1.1}
#rtime{font-size:15cqw;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;margin:1cqw 0}
#rtime small{font-size:6cqw;color:var(--mute)}
#newbest{display:none;color:var(--good);font-weight:900;font-size:4cqw;margin-top:1cqw}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin:3cqw 0}
#preview{width:100%;border-radius:2cqw;border:.4cqw solid var(--line);margin-top:2cqw;display:block}
#nameRow,#nameRow2{display:flex;gap:2cqw;align-items:center;margin-bottom:2cqw;font-size:3.4cqw;color:var(--mute)}
#nameRow input,#nameRow2 input{flex:1;min-width:0;background:#00000066;border:.4cqw solid var(--line);border-radius:2.4cqw;padding:2cqw;color:var(--ink);font:inherit;font-size:4cqw}
#rrank{margin-top:1cqw;font-size:4.4cqw;font-weight:800;color:var(--good)}
.tabs{display:flex;gap:2cqw;margin-bottom:2.5cqw}
.tabs button{flex:1;padding:2.2cqw;border-radius:3cqw;border:.4cqw solid var(--line);background:#00000066;color:var(--mute);font:inherit;font-size:3.8cqw;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--fire);color:#2a1000;border-color:var(--fire2)}
.tabs[hidden]{display:none}
#rkMetric button{padding:2.2cqw 1cqw;font-size:3.5cqw}
#rkMetric button.on{background:#2fb7c9;color:#04222a;border-color:#8fe6f2}
#rkStatus{color:var(--mute);font-size:3.2cqw;margin-bottom:2cqw;min-height:4cqw}
#rrankOn,#rrankAcc,#rrankCombo{font-size:4cqw;font-weight:800;color:var(--fire2)}
.rk{list-style:none;margin:0 0 2cqw;padding:0;text-align:left}
.rk li{display:grid;grid-template-columns:10cqw 1fr auto;gap:2cqw;align-items:baseline;padding:1.4cqw 2.4cqw;margin-bottom:.8cqw;
  background:#00000066;border:.4cqw solid var(--line);border-radius:2.4cqw;font-size:3.8cqw}
.rk li.me{border-color:var(--fire2);background:#ff7a1a33}
.rk b{font-variant-numeric:tabular-nums;font-size:4.4cqw}
.rk em{font-style:normal;color:var(--mute);font-size:3cqw;display:block}
.rk .n{color:var(--fire2);font-weight:900}
.empty{color:var(--mute);padding:6cqw 0}
.langrow{display:flex;justify-content:flex-end;margin-bottom:1cqw}
.ib.lang,.ib.pill{width:auto;min-width:9cqw;padding:0 2.4cqw;border-radius:5cqw;font-size:3.4cqw;font-weight:800;color:var(--ink)}
#ovResult{background:radial-gradient(ellipse at 50% 40%,rgba(18,10,5,.55),rgba(8,4,2,.82))}
.stickybar{position:sticky;bottom:max(2cqw,env(safe-area-inset-bottom,0px));z-index:6;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
#toast{position:fixed;left:50%;bottom:6cqw;transform:translateX(-50%);background:#000c;color:#fff;
  padding:2cqw 4cqw;border-radius:3cqw;font-size:3.6cqw;opacity:0;transition:opacity .25s;pointer-events:none;
  max-width:90%;text-align:center;z-index:5}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="row">
      <div id="time">0.00<small data-i="unit">秒</small></div>
      <div class="btns">
        <button class="ib lang" id="bLang2" aria-label="Language">EN</button>
        <button class="ib" id="bMute" aria-label="Sound">🔊</button>
        <button class="ib" id="bRetry" aria-label="Retry">↻</button>
      </div>
    </div>
    <div id="gaugeWrap">
      <div id="gauge"><div id="gfill"></div><i style="left:25%"></i><i style="left:55%"></i><i style="left:85%"></i></div>
      <div id="glabels"><span style="left:12.5%" data-i="gSt1">こする</span><span style="left:40%" data-i="gSt2">煙</span><span style="left:70%" data-i="gSt3">火種</span><span style="left:92.5%" data-i="gSt4">着火</span></div>
    </div>
    <div id="hint"></div>
  </div>
  <div id="combo"></div>

  <div class="ov on" id="ovTitle"><div class="card">
    <div class="langrow"><button class="ib lang" id="bLang" aria-label="Language">EN</button></div>
    <h1 data-h="title">🔥 火おこし 🏹<br>RTA</h1>
    <div class="sub" data-i="sub">原始人になって、木の棒で火をおこせ！</div>
    <div class="how" data-h="how"></div>
    <div class="rec">
      <div><small data-i="recBest">ベスト</small><b id="tBest">-</b></div>
      <div><small data-i="recPlays">プレイ</small><b id="tPlays">0</b></div>
    </div>
    <div id="nameRow"><label for="pname" data-i="nameLabel">なまえ</label><input id="pname" maxlength="8" data-p="anon" autocomplete="off"></div>
    <button class="btn" id="bStart" data-i="start">スタート</button>
    <button class="btn sec" id="bRank" data-i="rankBtn">🏆 ランキング</button>
  </div></div>

  <div class="ov" id="ovRank"><div class="card">
    <div class="langrow"><button class="ib pill" id="bRankBack2" data-i="back">もどる</button></div>
    <h1 style="font-size:9cqw" data-i="rankBtn">🏆 ランキング</h1>
    <div class="tabs" id="rkTabs" hidden><button id="tabOn" data-i="tabOnline">オンライン</button><button id="tabLocal" data-i="tabLocal">この端末</button></div>
    <div class="tabs" id="rkMetric"><button id="mtTime" data-i="mTime">速さ</button><button id="mtAcc" data-i="mAcc">正確さ</button><button id="mtCombo" data-i="mCombo">コンボ</button></div>
    <div id="nameRow2"><label for="pname2" data-i="nameLabel">なまえ</label><input id="pname2" maxlength="8" data-p="anon" autocomplete="off"></div>
    <div class="sub" id="rkSub"></div>
    <div id="rkStatus"></div>
    <ol class="rk" id="rkList"></ol>
    <div class="stickybar"><button class="btn share" id="bRankShare" data-i="share">シェア</button><button class="btn" id="bRankBack" data-i="back">もどる</button></div>
  </div></div>

  <div class="ov" id="ovResult"><div class="card">
    <div id="rank"></div>
    <div id="rtime"></div>
    <div id="rrank"></div>
    <div id="rrankOn"></div>
    <div id="rrankAcc"></div>
    <div id="rrankCombo"></div>
    <div id="newbest" data-i="newBest">🏆 ベスト更新！</div>
    <div class="stat">
      <div><small data-i="sAcc">正確さ</small><b id="sAcc"></b></div>
      <div><small data-i="sCombo">最大コンボ</small><b id="sCombo"></b></div>
      <div><small data-i="sN">こすった数</small><b id="sN"></b></div>
    </div>
    <img id="preview" alt="share image">
    <button class="btn share" id="bShare" data-i="share">📷 画像つきでシェア</button>
    <div class="two">
      <button class="btn" id="bAgain" data-i="again">もう一回</button>
      <button class="btn sec" id="bHome" data-i="home">タイトル</button>
    </div>
    <button class="btn sec" id="bRank2" data-i="rank2">🏆 ランキング</button>
  </div></div>

  <div id="toast"></div>
</div>

<script src="firebase-config.js"></script>
<script>
(() => {
'use strict';
// ───────── 定数 ─────────
const W = 720, H = 960;
const P = { x: 360, y: 790 };          // 棒の先が当たる点
const STICK_LEN = 600;
const REV = 14;                        // 反転とみなす戻り量(px)
const MIN_LEN = 36;                    // ストロークとみなす最小長(px)
const IDEAL_R = 0.7;                   // 理想の傾き(下/横)。約35°
const KEY = 'hiokoshi.v1';
const RANK_MAX = 100;                  // ランキングの表示・保持件数
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);

// ───────── 記録 ─────────
function loadRec() {
  const d = { bestTime: 0, plays: 0, name: '', ranks: [], accRanks: [], comboRanks: [], lang: '' };
  try { Object.assign(d, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  return d;
}
const rec = loadRec();
function saveRec() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} }
const fmt = n => Math.round(n).toLocaleString('en-US');

// ───────── 言語 ─────────
const I18N = {
  ja: {
    unit: '秒', gSt1: 'こする', gSt2: '煙', gSt3: '火種', gSt4: '着火',
    title: '🔥 火おこし 🏹<br>RTA', sub: '原始人になって、木の棒で火をおこせ！',

    recBest: 'ベスト', recPlays: 'プレイ', nameLabel: 'なまえ', anon: 'ななし',

    hReady: '棒を ジグザグに こすって スタート！', hIgnite: '🔥 着火！！', hStall: '斜め下へ 右・左・右・左…と 交互に！',

    jBack: '戻し', jFlat: 'ヨコすぎ', jSteep: 'タテすぎ', jPerfect: 'PERFECT', jGood: 'GOOD', jOk: 'OK', jSloppy: 'ざつ',
    s1: '炎竜王', s2: '太陽神', s3: '創世の炎', r0: '火の神', r1: '炎の達人', r2: '縄文の匠', r3: '石器時代の民', r4: 'たき火見習い', r5: 'まだ寒い',
    mNametime: '速さランキング', mNameacc: '正確さランキング', mNamecombo: 'コンボランキング', rankShareText: '火おこしRTA 🏆 {0}（{1}）',
    mCombo: '🔥 コンボ', subOnC: 'みんなの最大コンボTOP100（1人1記録）', subLocalC: 'この端末の最大コンボTOP100', comboN: '{0}コンボ', rowInfoC: '{0}秒 ・ 正確さ{1}% ・ {2}',
    rrankComboIn: 'コンボランキング {0}位！', rrankComboOut: 'コンボランク圏外（100位まで）', rrankComboOnIn: 'オンラインコンボ {0}位！', rrankComboOnOut: 'オンラインコンボ圏外',
    mTime: '⏱ 速さ', mAcc: '🎯 正確さ', subOnA: 'みんなの正確さTOP100（1人1記録）', subLocalA: 'この端末の正確さTOP100',
    playNo: '{0}回目', rowInfoA: '{0}秒 ・ {1}', rrankAccIn: '正確さランキング {0}位！', rrankAccOut: '正確さランク圏外（100位まで）', rrankAccOnIn: 'オンライン正確さ {0}位！', rrankAccOnOut: 'オンライン正確さ圏外',
    tabOnline: 'オンライン', tabLocal: 'この端末', subOn: 'みんなの最速100人（1人1記録）', subLocal: 'この端末の最速TOP100',
    rkLoading: '読み込み中…', rkFail: 'ランキングを取得できませんでした', rkOffline: 'オンラインランキングは未接続です',
    rrankOnIn: 'オンライン {0}位！', rrankOnOut: 'オンライン圏外（100位まで）', rrankOnFail: 'オンラインには登録できませんでした', rrankOnSend: 'オンラインに登録中…',
    rrankIn: 'ランキング {0}位！', rrankOut: 'ランク圏外（100位まで）', empty: 'まだ記録がありません',

    cardTitle: '火おこしRTA', cardStats: '正確さ {0}% / 最大コンボ {1} / {2}ストローク', tag: '#火おこしRTA',

  },
  en: {
    unit: 's', gSt1: 'Rub', gSt2: 'Smoke', gSt3: 'Ember', gSt4: 'Fire',
    title: '🔥 FIRE 🏹<br>STARTER RTA', sub: 'Be a caveman. Start a fire with a stick!',
    how: '<b>Drag</b> on the screen to rub the stick.<br>Rub <b>down-right ⇄ down-left</b> — <b>accurately, fast, alternating</b> — to make smoke and light the fire sooner!<br>Too flat, too steep, or sloppy strokes let the heat escape.',
    recBest: 'Best', recPlays: 'Plays', nameLabel: 'Name', anon: 'Anon',
    start: 'Start', rankBtn: '🏆 Ranking', back: 'Back',
    newBest: '🏆 New best!', sAcc: 'Accuracy', sCombo: 'Max combo', sN: 'Strokes',
    share: 'Share', again: 'Again', home: 'Title', rank2: '🏆 Ranking',
    hReady: 'Rub the stick in a zigzag to start!', hIgnite: '🔥 Ignited!!', hStall: 'Alternate down-right, down-left, down-right…',
    h1: 'Rub faster!', h2: 'Smoke is rising!', h3: 'An ember in the sawdust!', h4: 'Almost there!!',
    jBack: 'Reset', jFlat: 'Too flat', jSteep: 'Too steep', jPerfect: 'PERFECT', jGood: 'GOOD', jOk: 'OK', jSloppy: 'Sloppy',
    s1: 'Flame Dragon King', s2: 'Sun God', s3: 'Genesis Flame', r0: 'God of Fire', r1: 'Flame Master', r2: 'Jomon Artisan', r3: 'Stone Age Folk', r4: 'Campfire Rookie', r5: 'Still Cold',
    mNametime: 'Speed Ranking', mNameacc: 'Accuracy Ranking', mNamecombo: 'Combo Ranking', rankShareText: 'Fire Starter RTA 🏆 {0} ({1})',
    mCombo: '🔥 Combo', subOnC: 'Top 100 combo players (best each)', subLocalC: 'Max combo TOP100 on this device', comboN: '{0} combo', rowInfoC: '{0}s ・ Acc {1}% ・ {2}',
    rrankComboIn: 'Combo rank #{0}!', rrankComboOut: 'Not in the combo top 100', rrankComboOnIn: 'Online combo #{0}!', rrankComboOnOut: 'Not in the online combo top 100',
    mTime: '⏱ Speed', mAcc: '🎯 Accuracy', subOnA: 'Top 100 most accurate players (best each)', subLocalA: 'Top 100 most accurate runs on this device',
    playNo: 'Run #{0}', rowInfoA: '{0}s ・ {1}', rrankAccIn: 'Accuracy rank #{0}!', rrankAccOut: 'Not in the accuracy top 100', rrankAccOnIn: 'Online accuracy #{0}!', rrankAccOnOut: 'Not in the online accuracy top 100',
    tabOnline: 'Online', tabLocal: 'This device', subOn: 'Top 100 fastest players (best time each)', subLocal: 'Fastest TOP100 on this device',
    rkLoading: 'Loading…', rkFail: 'Couldn\'t load the ranking', rkOffline: 'Online ranking is not connected',
    rrankOnIn: 'Online rank #{0}!', rrankOnOut: 'Not in the online top 100', rrankOnFail: 'Couldn\'t post to the online ranking', rrankOnSend: 'Posting to the online ranking…',
    rrankIn: 'Rank #{0}!', rrankOut: 'Not in the top 100', empty: 'No records yet',
    rowInfo: 'Acc {0}% ・ {1}',
    cardTitle: 'Fire Starter RTA', cardStats: 'Accuracy {0}% / Max combo {1} / {2} strokes', tag: '#FireStarterRTA',
    shareText: 'Fire Starter RTA 🔥 Lit in {0}s! ({1}) #FireStarterRTA',
    tWait: 'Making the image… tap again', tSaved: 'Text copied and image saved. Attach it to your post.',
    tCopied: 'Text copied. Long-press / right-click the image to save and attach it.', langBtn: '日本語', docTitle: 'Fire Starter RTA'
  }
};
let lang = rec.lang || ((navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en');
const t = (k, ...a) => {
  let v = (I18N[lang] && I18N[lang][k]) ?? I18N.ja[k] ?? k;
  a.forEach((x, i) => { v = v.replace('{' + i + '}', x); });
  return v;
};

// ───────── Canvas ─────────
const cv = $('cv'), ctx = cv.getContext('2d');

let down = false, px = 0, py = 0, pt = 0, tr = null, startX = 0;

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  if (mode === 'ignite' && performance.now() - igniteAt > 900) { showResult(); return; }   // タップで結果へ
  if (mode !== 'ready' && mode !== 'play') return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  initAudio();
  const p = toLogical(e);
  down = true; px = startX = p.x; py = p.y; pt = e.timeStamp; tr = null;
});
cv.addEventListener('pointermove', e => {
  if (!down) return;
  e.preventDefault();
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  for (const ev of (list && list.length ? list : [e])) {
    const p = toLogical(ev);
    onMove(p.x, p.y, ev.timeStamp);
  }
});
const up = () => { down = false; tr = null; };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('lostpointercapture', up);

function onMove(x, y, t) {
  if (mode !== 'ready' && mode !== 'play') return;
  const dx = x - px, dt = Math.max(1, t - pt);
  px = x; py = y; pt = t;
  spin += dx * 0.09;
  palmShift = clamp(palmShift + dx * .15, -22, 22);
  rubSpeed = Math.max(rubSpeed, Math.min(2, Math.abs(dx) / dt));
  if (mode === 'ready' && Math.abs(x - startX) > 8) startRun();
  if (!tr) { tr = { dir: 0, sx: x, sy: y, st: t, ex: x, ey: y, et: t }; return; }
  if (tr.dir === 0) {
    if (Math.abs(x - tr.sx) > REV) { tr.dir = Math.sign(x - tr.sx); tr.ex = x; tr.ey = y; tr.et = t; }
    return;
  }
  if ((x - tr.ex) * tr.dir >= 0) { tr.ex = x; tr.ey = y; tr.et = t; }
  else if ((tr.ex - x) * tr.dir > REV) {
    const nd = -tr.dir;
    commit(tr);
    if (mode !== 'play') return;
    tr = { dir: nd, sx: tr.ex, sy: tr.ey, st: tr.et, ex: x, ey: y, et: t };
  }
}

function startRun() {
  mode = 'play'; tStart = performance.now(); stalled = 0;
}

// 1ストロークの評価 → 熱に変換
function commit(s) {
  if (mode !== 'play') return;
  const L = Math.abs(s.ex - s.sx), dy = s.ey - s.sy;
  if (L < MIN_LEN) return;
  const r = dy / L;                                   // 下向き成分の比
  const dt = Math.max(24, s.et - s.st);
  const v = L / dt;                                   // px/ms
  if (r < -0.35) { floatText(t('jBack'), 'rgba(200,200,200,.9)'); return; }   // 持ち替えの上向き動作
  const accA = clamp(1 - Math.abs(r - IDEAL_R) / 0.75, 0, 1);              // 斜め下の正確さ
  const ratio = lastL ? Math.min(L, lastL) / Math.max(L, lastL) : 1;
  const cons = clamp((ratio - .4) / .5, 0, 1);                             // 長さの安定
  const q = accA * (0.7 + 0.3 * cons);
  lastL = L;
  const spd = clamp(v / 0.8, 0.15, 1.5);
  const lenF = clamp(L / 90, 0.4, 1.3);
  if (q >= .5) { combo++; maxCombo = Math.max(maxCombo, combo); } else if (q < .3) combo = 0;
  const mult = 1 + Math.min(combo, 24) * 0.035;
  const gain = 5.0 * q * spd * lenF * mult;
  n++; qSum += q;
  T = Math.min(100, T + gain);
  depth += clamp(dy, 0, 200) / 900;
  if (depth >= 1) depth -= 1, depthVis = -.15;
  shake = Math.min(1, shake + .35);
  // 判定表示
  let txt, col;
  if (r < 0.2) { txt = t('jFlat'); col = '#ff9a7a'; }
  else if (r > 1.5) { txt = t('jSteep'); col = '#ff9a7a'; }
  else if (q >= .85) { txt = t('jPerfect'); col = '#ffe066'; }
  else if (q >= .6) { txt = t('jGood'); col = '#9be564'; }
  else if (q >= .3) { txt = t('jOk'); col = '#d9d9d9'; }
  else { txt = t('jSloppy'); col = '#ff9a7a'; }
  floatText(txt, col);
  strokeSound(q, r < 0.2 || r > 1.5);
  // おがくず
  for (let i = 0; i < 4; i++) dust.push({
    x: P.x + rnd(-6, 6), y: P.y, vx: s.dir * rnd(30, 110) * -1 + rnd(-30, 30), vy: rnd(-90, -20),
    life: rnd(.35, .7), age: 0, s: rnd(1.5, 3)
  });
  stalled = 0;
  if (T >= 100) ignite();
}

function floatText(text, color) {
  for (const f of floaters) f.ty -= 50;          // 古い表示は押し上げて、少し残す

async function shareImage(blob, text, filename) {
  const url = /^https?:/.test(location.protocol) ? location.href : '';
  const file = new File([blob], filename, { type: 'image/png' });
  // 端末の共有シート（画像つき）。タップ直後に呼ぶ必要があるので、可否は同期で判定して最初に通るものを使う
  const full = { title: t('docTitle'), text, files: [file] };
  if (url) full.url = url;
  const cands = [full, { text: url ? text + ' ' + url : text, files: [file] }, { files: [file] }];
  if (navigator.share && navigator.canShare) {
    const data = cands.find(d => { try { return navigator.canShare(d); } catch (e) { return false; } });
    if (data) {
      try { await navigator.share(data); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  // フォールバック：文面コピー + 画像保存 + X の投稿画面
  try { navigator.clipboard.writeText(url ? text + ' ' + url : text).catch(() => {}); } catch (e) {}
  let saved = false;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data: blob }); saved = true; }
  } catch (e) {}
  if (!saved) {
    const a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 10000);
  }
  const intent = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + (url ? '&url=' + encodeURIComponent(url) : '');
  window.open(intent, '_blank', 'noopener');
  toast(t('tSaved'));
}

// ───────── 音 ─────────
let ac, rubGain, rubFilter, muted = false, noiseBuf, soundQ = .5;
function initAudio() {
  if (ac || muted) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    rubFilter = ac.createBiquadFilter(); rubFilter.type = 'bandpass'; rubFilter.frequency.value = 800; rubFilter.Q.value = .9;
    rubGain = ac.createGain(); rubGain.gain.value = 0;
    src.connect(rubFilter); rubFilter.connect(rubGain); rubGain.connect(ac.destination); src.start();
  } catch (e) { ac = null; }
}
function audioFrame() {
  if (!ac || !rubGain) return;
  const on = !muted && down && (mode === 'play' || mode === 'ready');
  // 擦りの質(soundQ)で音色を変える：良いほど高く澄んだ音、悪いほど低くざらついた音
  const vol = Math.min(.2, rubSpeed * .13) * (.55 + .45 * soundQ);
  rubGain.gain.setTargetAtTime(on ? vol : 0, ac.currentTime, .03);
  rubFilter.frequency.setTargetAtTime(350 + soundQ * 1300 + rubSpeed * 500 + T * 6, ac.currentTime, .05);
  rubFilter.Q.setTargetAtTime(.6 + soundQ * 3.2, ac.currentTime, .05);
}
function tone(freq, dur, vol, type) {
  if (!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .005); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + .02);
}
// 判定ごとの一打の音
const PENTA = [0, 2, 4, 7, 9];
const noteHz = idx => 523.25 * Math.pow(2, (PENTA[idx % 5] + 12 * Math.floor(idx / 5)) / 12);
function strokeSound(q, bad) {
  soundQ = bad ? Math.min(q, .15) : q;
  if (!ac || muted) return;
  if (bad || q < .3) { tone(150, .1, .045, 'triangle'); burst(0, .07, 320, .06, 'lowpass'); return; }
  const idx = Math.min(Math.max(combo, 0), 14);      // コンボが続くほど音階を駆け上がる
  const f = noteHz(idx);
  if (q < .6) { tone(f / 2, .12, .07, 'triangle'); }
  else if (q < .85) { tone(f, .16, .1, 'triangle'); tone(f * 2, .1, .03, 'sine'); }
  else { tone(f, .2, .13, 'sine'); tone(f * 2, .16, .055, 'sine'); tone(f * 3, .1, .02, 'sine'); }
}
function burst(delay, dur, freq, vol, type) {
  if (!ac || muted) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq;
  const g = ac.createGain(); const t0 = ac.currentTime + delay;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t0, Math.random()); s.stop(t0 + dur + .05);
}
function boom() {
  burst(0, .6, 400, .5, 'lowpass');
  for (let i = 0; i < 18; i++) burst(.1 + i * .11 + Math.random() * .08, .05, 2000 + Math.random() * 3000, .12);
}

      ctx.fillStyle = '#e9dcc0'; ctx.beginPath(); ctx.arc(-18, -2, 3.5, 0, 7); ctx.arc(-18, 3, 3.5, 0, 7); ctx.fill(); ctx.fillRect(-18, -1.5, 12, 3);
      ctx.fillStyle = mixHex([200, 90, 80], [96, 48, 22], cook); ctx.beginPath(); ctx.ellipse(6, 0, 17, 12, 0, 0, 7); ctx.fill();

}
let flies = [];
function spawnFlies(n) { flies = Array.from({ length: n }, () => ({ x: rnd(30, 690), y: rnd(300, 740), ph: rnd(0, 6.3), sp: rnd(.5, 1.1), r: rnd(18, 60), at: rnd(.4, 3) })); }
function drawFireflies() {
  if (mode !== 'ignite' && mode !== 'result') return;
  const now = (performance.now() - igniteAt) / 1000;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of flies) {
    const age = now - f.at; if (age < 0) continue;
    const a = Math.min(1, age) * (.3 + .7 * Math.abs(Math.sin(clock * f.sp * 2.2 + f.ph)));
    const x = f.x + Math.sin(clock * f.sp + f.ph) * f.r, y = f.y + Math.cos(clock * f.sp * .7 + f.ph * 2) * f.r * .6;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
    g.addColorStop(0, `rgba(210,255,110,${a})`); g.addColorStop(.4, `rgba(170,240,80,${a * .45})`); g.addColorStop(1, 'rgba(170,240,80,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 9, y - 9, 18, 18);
  }
  ctx.restore();
}
// シェア画像用：同じ来訪者を静止画で描く
function drawVisitorsCard(g, tr) {
  for (const v of VIS.filter(v => visOn(v, tr)).sort((a, b) => a.cy - b.cy)) drawAnimal(g, v.id, v.cx, v.cy, v.cs, v.cx < 290 ? 1 : -1);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0, n = 4 + (8 - tr) * 4; i < n; i++) {
    const x = rnd(20, 560), y = rnd(250, 470), gr = g.createRadialGradient(x, y, 0, x, y, 12);
    gr.addColorStop(0, 'rgba(210,255,110,.95)'); gr.addColorStop(.4, 'rgba(170,240,80,.4)'); gr.addColorStop(1, 'rgba(170,240,80,0)');
    g.fillStyle = gr; g.fillRect(x - 12, y - 12, 24, 24);

}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(bg, 0, 0);
  drawVisitors();
  const burnt = (mode === 'ignite' || mode === 'result') ? (performance.now() - igniteAt) / 3000 : 0;
  ctx.save();
  if (shake > 0) ctx.translate(Math.sin(clock * 90) * shake * 1.5, 0);
  drawBoard(); drawSawdust(); drawGrass(burnt); drawStick();
  ctx.restore();
  drawGlow(); drawParticles(); drawRoast(); drawFireflies(); drawGuide(); drawFloaters();
}

// ───────── HUD ─────────
let lastHint = '';
function setHint(s) { if (s !== lastHint) { $('hint').textContent = s; lastHint = s; } }
function updateHud() {
  $('time').firstChild.nodeValue = elapsed.toFixed(2);
  $('gfill').style.width = T + '%';
  const cb = $('combo');
  if (combo >= 3 && mode === 'play') { cb.textContent = combo + ' COMBO'; cb.classList.add('on'); } else cb.classList.remove('on');
  let h;
  if (mode === 'ready') h = t('hReady');
  else if (mode === 'ignite') h = t('hIgnite');
  else if (stalled > 2.5 && T < 60) h = t('hStall');
  else if (T < 25) h = t('h1');
  else if (T < 55) h = t('h2');
  else if (T < 85) h = t('h3');
  else h = t('h4');
  setHint(h);
}

// ───────── ループ ─────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  if (mode === 'play') {
    elapsed = (now - tStart) / 1000;
    T = Math.max(0, T - (1.05 + .042 * T) * dt);
    stalled += dt;
    if (T < 0.5 && elapsed > 90) elapsed = 99.99;
  }
  rubSpeed *= Math.exp(-dt * 7);
  shake = Math.max(0, shake - dt * 4);
  depthVis = lerp(depthVis, depth, 1 - Math.exp(-dt * 20));
  if (depth < depthVis - .5) depthVis = depth;
  updateParticles(dt);
  render();
  if (mode === 'play' || mode === 'ready' || mode === 'ignite') updateHud();
  audioFrame();
  requestAnimationFrame(frame);
}

// ───────── 画面遷移 ─────────
// オンラインランキングの窓口。claude.ai の Artifact では共有DB、それ以外は REST（下記）に接続する。
//   REST: <meta name="ranking-endpoint" content="https://…"> か window.HIOKOSHI_RANK_URL を設定すると、
//   GET  {url}/scores?limit=10[&metric=acc] → [{n,t,a,c,d,u?}, …]（既定はタイム昇順＝速い順、metric=acc は正確さ順、metric=combo は最大コンボ順）
//   POST {url}/scores  {n,t,a} → 1人1記録のベスト更新は サーバー側で処理
const Online = {
  kind: null, db: null, uid: null, url: null, fs: null, fdb: null,
  async init() {
    try {
      if (window.claude && window.claude.use) {
        const db = await window.claude.use('db');
        if (db) {
          const user = await window.claude.use('user');
          this.uid = user && user.id ? await user.id() : null;
          this.db = db; this.kind = 'db'; return;
        }
      }
    } catch (e) {}
    const cfg = window.HIOKOSHI_FIREBASE;
    if (cfg && cfg.projectId) {            // Firebase（匿名ログイン + Firestore）
      try {
        const V = 'https://www.gstatic.com/firebasejs/10.14.1/';
        const [app, auth, fs] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
        const a = app.initializeApp(cfg);
        const cred = await auth.signInAnonymously(auth.getAuth(a));
        this.fs = fs; this.fdb = fs.getFirestore(a); this.uid = cred.user.uid; this.kind = 'fb'; return;
      } catch (e) { console.warn('Firebase init failed', e); }
    }
    const m = document.querySelector('meta[name="ranking-endpoint"]');
    const u = window.HIOKOSHI_RANK_URL || (m && m.content);
    if (u && /^https?:/.test(u)) { this.url = u.replace(/\/$/, ''); this.kind = 'rest'; }
  },
  // metric: 'time'（速い順）| 'acc'（正確さの高い順、同率はタイムが速い順）
  async top(metric = 'time', n = RANK_MAX) {
    const M = { time: ['scores', 't', 'asc'], acc: ['accuracy', 'a', 'desc'], combo: ['combo', 'c', 'desc'] }[metric] || ['scores', 't', 'asc'];
    const [col, field, dir] = M, take = metric === 'time' ? n : Math.min(1000, n * 3);   // 同率の並べ替えのため多めに取る
    let docs;
    if (this.kind === 'db') {
      const snap = await this.db.collection(col).orderBy(field, dir).limit(take).get();
      docs = snap.docs.map(d => d.data());
    } else if (this.kind === 'fb') {
      const f = this.fs;
      const snap = await f.getDocs(f.query(f.collection(this.fdb, col), f.orderBy(field, dir), f.limit(take)));
      docs = snap.docs.map(d => d.data());
    } else if (this.kind === 'rest') {
      const r = await fetch(this.url + '/scores?limit=' + take + (metric === 'time' ? '' : '&metric=' + metric));
      if (!r.ok) throw new Error('http ' + r.status);
      docs = await r.json();
    } else throw new Error('offline');
    docs = docs.filter(e => e && typeof e.t === 'number' && typeof e.a === 'number' && (metric !== 'combo' || typeof e.c === 'number'));
    if (metric === 'acc') docs.sort((x, y) => y.a - x.a || x.t - y.t);
    if (metric === 'combo') docs.sort((x, y) => y.c - x.c || x.t - y.t);
    return docs.slice(0, n);
  },
  // 名前の変更を、自分のオンライン記録にも反映する（タイムや正確さは変えない）
  async rename(name) {
    const n = String(name || '').slice(0, 8);
    if (!n) return;
    if (this.kind === 'db' && this.uid) {
      for (const c of ['scores', 'accuracy', 'combo']) { const ref = this.db.doc(c + '/' + this.uid); if ((await ref.get()).exists) await ref.update({ n }); }
    } else if (this.kind === 'fb' && this.uid) {
      const f = this.fs;
      for (const c of ['scores', 'accuracy', 'combo']) { const ref = f.doc(this.fdb, c, this.uid); if ((await f.getDoc(ref)).exists()) await f.updateDoc(ref, { n }); }
    }
  },
  async submit(e) {
    if (this.kind === 'db') {
      if (!this.uid) throw new Error('no user');
      const base = { n: e.n, t: e.t, a: e.a, d: e.d, u: this.uid };
      const r1 = this.db.doc('scores/' + this.uid), c1 = await r1.get();
      if (!(c1.exists && c1.data().t <= e.t)) await r1.set(base);
      const r2 = this.db.doc('accuracy/' + this.uid), c2 = await r2.get();
      if (!(c2.exists && c2.data().a >= e.a)) await r2.set(base);
      const r3 = this.db.doc('combo/' + this.uid), c3 = await r3.get();
      if (!(c3.exists && c3.data().c >= e.c)) await r3.set({ ...base, c: e.c });
    } else if (this.kind === 'fb') {
      const f = this.fs, base = { n: String(e.n).slice(0, 8), t: e.t, a: e.a, d: e.d, u: this.uid };
      const r1 = f.doc(this.fdb, 'scores', this.uid), c1 = await f.getDoc(r1);
      if (!(c1.exists() && c1.data().t <= e.t)) await f.setDoc(r1, base);
      const r2 = f.doc(this.fdb, 'accuracy', this.uid), c2 = await f.getDoc(r2);
      if (!(c2.exists() && c2.data().a >= e.a)) await f.setDoc(r2, base);
      const r3 = f.doc(this.fdb, 'combo', this.uid), c3 = await f.getDoc(r3);
      if (!(c3.exists() && c3.data().c >= e.c)) await f.setDoc(r3, { ...base, c: e.c });
    } else if (this.kind === 'rest') {
      const r = await fetch(this.url + '/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n: e.n, t: e.t, a: e.a, c: e.c }) });
      if (!r.ok) throw new Error('http ' + r.status);
    } else throw new Error('offline');
  }
};
const isMine = (e, hl) => !!hl && ((e.u && Online.uid && e.u === Online.uid) || e.d === hl);

let rankTab = 'local', rankMetric = 'time', rankHl = null, rankToken = 0;
const fmtDate = e => { const d = new Date(e.d); return (d.getMonth() + 1) + '/' + d.getDate(); };
const rankBig = (e, metric) => metric === 'acc' ? (e.a * 100).toFixed(1) + '%' : metric === 'combo' ? t('comboN', e.c) : Number(e.t).toFixed(2) + t('unit');
const rankInfo = (e, metric) => {
  const date = fmtDate(e);
  return metric === 'acc' ? t('rowInfoA', Number(e.t).toFixed(2), date) : metric === 'combo' ? t('rowInfoC', Number(e.t).toFixed(2), Math.round(e.a * 100), date) : t('rowInfo', Math.round(e.a * 100), date);
};
function drawRankList(list, hl, metric) {
  const ul = $('rkList'); ul.textContent = '';
  if (!list.length) { ul.innerHTML = '<div class="empty">' + t('empty') + '</div>'; return; }
  list.slice(0, RANK_MAX).forEach((e, i) => {
    const li = document.createElement('li');
    if (isMine(e, hl)) li.className = 'me';
    li.innerHTML = `<span class="n">${i + 1}</span><span></span><b>${rankBig(e, metric)}</b>`;
    const mid = li.children[1];
    mid.textContent = String(e.n || '');
    const em = document.createElement('em');
    em.textContent = (e.p ? t('playNo', e.p) + ' ・ ' : '') + rankInfo(e, metric);
    mid.appendChild(em);
    ul.appendChild(li);
  });
  makeRankCard(list.slice(0, RANK_MAX), hl, metric);
}

// ランキングのシェア画像（上位10件を2列で）
let rankBlob = null, rankCardToken = 0;
function makeRankCard(list, hl, metric) {
  const my = ++rankCardToken; rankBlob = null;
  if (!list.length) return;
  const c = document.createElement('canvas'); c.width = 1200; c.height = 630;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 630);
  gr.addColorStop(0, '#0b1230'); gr.addColorStop(.6, '#3a2250'); gr.addColorStop(1, '#8a3a1a');
  g.fillStyle = gr; g.fillRect(0, 0, 1200, 630);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${rnd(.15, .7)})`; g.fillRect(rnd(0, 1200), rnd(0, 200), 2, 2); }
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.fillStyle = '#ffc84a'; g.font = `900 54px ${FONT}`;
  g.fillText('🏆 ' + t('cardTitle') + ' ' + t('mName' + metric), 50, 80);
  g.fillStyle = '#b79b78'; g.font = `600 28px ${FONT}`; g.textAlign = 'right';
  g.fillText(t(rankTab === 'online' ? 'tabOnline' : 'tabLocal'), 1150, 78);
  g.textAlign = 'left';
  const colW = 550, rowH = 84, y0 = 112;
  list.slice(0, 10).forEach((e, i) => {
    const x = 50 + (i >= 5 ? 1 : 0) * (colW + 50), y = y0 + (i % 5) * (rowH + 12);
    g.fillStyle = isMine(e, hl) ? 'rgba(255,122,26,.35)' : 'rgba(0,0,0,.4)';
    g.beginPath(); g.roundRect(x, y, colW, rowH, 16); g.fill();
    if (isMine(e, hl)) { g.strokeStyle = '#ffc84a'; g.lineWidth = 3; g.stroke(); }
    g.fillStyle = i < 3 ? '#ffc84a' : '#f6e7cf'; g.font = `900 40px ${FONT}`; g.textAlign = 'center'; g.fillText(String(i + 1), x + 44, y + 56); g.textAlign = 'left';
    g.fillStyle = '#f6e7cf'; g.font = `700 30px ${FONT}`; g.fillText(String(e.n || '').slice(0, 8), x + 92, y + 38);
    g.fillStyle = '#b79b78'; g.font = `500 20px ${FONT}`; g.fillText(rankInfo(e, metric), x + 92, y + 68);
    g.fillStyle = '#f6e7cf'; g.font = `800 38px ${FONT}`; g.textAlign = 'right'; g.fillText(rankBig(e, metric), x + colW - 22, y + 55); g.textAlign = 'left';
  });
  g.fillStyle = '#b79b78'; g.font = `600 26px ${FONT}`; g.textAlign = 'right'; g.fillText(t('tag'), 1150, 608);
  c.toBlob(b => { if (my === rankCardToken) rankBlob = b; }, 'image/png');
}
async function showRank(hl, tab, metric) {
  if (hl !== undefined) rankHl = hl;
  if (tab) rankTab = tab;
  if (metric) rankMetric = metric;
  const online = !!Online.kind, acc = rankMetric === 'acc', cmb = rankMetric === 'combo';
  $('rkTabs').hidden = !online;
  if (!online) rankTab = 'local';
  $('tabOn').classList.toggle('on', rankTab === 'online');
  $('tabLocal').classList.toggle('on', rankTab === 'local');
  $('mtTime').classList.toggle('on', !acc && !cmb);
  $('mtAcc').classList.toggle('on', acc);
  $('mtCombo').classList.toggle('on', cmb);
  $('rkSub').textContent = t((rankTab === 'online' ? 'subOn' : 'subLocal') + (acc ? 'A' : cmb ? 'C' : ''));
  const my = ++rankToken;
  if (rankTab === 'local') {
    $('rkStatus').textContent = online ? '' : t('rkOffline');
    drawRankList(acc ? (rec.accRanks || []) : cmb ? (rec.comboRanks || []).filter(e => typeof e.c === 'number') : (rec.ranks || []), rankHl, rankMetric); return;
  }
  $('rkStatus').textContent = t('rkLoading'); $('rkList').textContent = '';
  try {
    const list = await Online.top(rankMetric, RANK_MAX);
    if (my !== rankToken) return;
    $('rkStatus').textContent = ''; drawRankList(list, rankHl, rankMetric);
  } catch (e) { if (my === rankToken) $('rkStatus').textContent = t('rkFail'); }
}
// 結果画面：オンラインへ登録して順位を表示
async function postOnline(entry) {
  const el = $('rrankOn'), ea = $('rrankAcc'), ec = $('rrankCombo');
  if (!Online.kind) { el.textContent = ''; return; }
  el.textContent = t('rrankOnSend');
  try {
    await Online.submit(entry);
    const [lt, la, lc] = await Promise.all([Online.top('time', RANK_MAX), Online.top('acc', RANK_MAX), Online.top('combo', RANK_MAX)]);
    if (!result || result.d !== entry.d) return;
    const i1 = lt.findIndex(e => isMine(e, entry.d)), i2 = la.findIndex(e => isMine(e, entry.d)), i3 = lc.findIndex(e => isMine(e, entry.d));
    el.textContent = i1 >= 0 ? t('rrankOnIn', i1 + 1) : t('rrankOnOut');
    ea.textContent = i2 >= 0 ? t('rrankAccOnIn', i2 + 1) : t('rrankAccOnOut');
    ec.textContent = i3 >= 0 ? t('rrankComboOnIn', i3 + 1) : t('rrankComboOnOut');
  } catch (e) { if (result && result.d === entry.d) el.textContent = t('rrankOnFail'); }
}
function refreshTitle() {
  $('pname').value = rec.name || ''; $('pname2').value = rec.name || '';
  $('tBest').textContent = rec.bestTime ? rec.bestTime.toFixed(2) + t('unit') : '-';
  $('tPlays').textContent = rec.plays;
}
function toReady() {
  resetRun(); down = false;
  mode = 'ready';
  $('ovTitle').classList.remove('on'); $('ovResult').classList.remove('on');
  $('hud').classList.add('on');
}
function toTitle() {
  mode = 'title'; resetRun(); refreshTitle();
  $('hud').classList.remove('on'); $('ovResult').classList.remove('on'); $('ovTitle').classList.add('on');
}
function commitName(v) {
  rec.name = String(v).trim().slice(0, 8);
  const shown = rec.name || t('anon');
  for (const list of [rec.ranks, rec.accRanks, rec.comboRanks]) (list || []).forEach(e => { e.n = shown; });   // この端末の記録は同じ人のものとして改名
  saveRec();
  $('pname').value = $('pname2').value = rec.name;
  if ($('ovRank').classList.contains('on')) showRank();
  Online.rename(shown).then(() => { if ($('ovRank').classList.contains('on') && rankTab === 'online') showRank(); }).catch(() => {});
}
for (const id of ['pname', 'pname2']) {
  let timer;
  $(id).addEventListener('input', e => {      // 入力が止まったら自動で確定（OKボタンなし）
    rec.name = e.target.value.trim().slice(0, 8); saveRec();
    clearTimeout(timer); const v = e.target.value; timer = setTimeout(() => commitName(v), 900);
  });
  $(id).addEventListener('change', e => commitName(e.target.value));
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
}
let rankFrom = 'ovTitle';
function openRank(from, hl) { rankFrom = from; showRank(hl || null, Online.kind ? 'online' : 'local'); $(from).classList.remove('on'); $('ovRank').classList.add('on'); }
$('bRank').onclick = () => openRank('ovTitle');
$('bRank2').onclick = () => openRank('ovResult', result && result.d);
$('mtTime').onclick = () => showRank(undefined, undefined, 'time');
$('mtAcc').onclick = () => showRank(undefined, undefined, 'acc');
$('mtCombo').onclick = () => showRank(undefined, undefined, 'combo');
$('tabOn').onclick = () => showRank(undefined, 'online');
$('tabLocal').onclick = () => showRank(undefined, 'local');
$('bRankBack').onclick = $('bRankBack2').onclick = () => { $('ovRank').classList.remove('on'); $(rankFrom).classList.add('on'); window.scrollTo(0, 0); };
$('bStart').onclick = () => { initAudio(); toReady(); };
$('bAgain').onclick = toReady;
$('bRetry').onclick = toReady;
$('bHome').onclick = toTitle;
$('bShare').onclick = doShare;
$('bRankShare').onclick = doRankShare;
$('bMute').onclick = () => {
  muted = !muted; $('bMute').textContent = muted ? '🔇' : '🔊';
  if (!muted) initAudio();
};
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.querySelectorAll('[data-i]').forEach(e => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll('[data-h]').forEach(e => { e.innerHTML = t(e.dataset.h); });
  document.querySelectorAll('[data-p]').forEach(e => { e.placeholder = t(e.dataset.p); });
  document.querySelectorAll('.lang').forEach(e => { e.textContent = t('langBtn'); });
  lastHint = '';
  if ($('ovRank').classList.contains('on')) showRank();
  if (result && mode === 'result') { renderResultText(); makeCard(); }
}
function toggleLang() { lang = lang === 'ja' ? 'en' : 'ja'; rec.lang = lang; saveRec(); applyLang(); }
$('bLang').onclick = toggleLang;
$('bLang2').onclick = toggleLang;
document.addEventListener('contextmenu', e => e.preventDefault());

// テスト・デバッグ用
window.__hioko = { async card(ri, t) { const b = await renderCard({ t, acc: .97, combo: 20, n: 25, ri }); return await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); }, demo(n) { tier = n; spawnFlies(6 + (8 - n) * 5); igniteAt = performance.now() - 6000; mode = 'ignite'; $('ovTitle').classList.remove('on'); $('hud').classList.add('on'); }, get T() { return T; }, get mode() { return mode; }, get result() { return result; } };

refreshTitle();
applyLang();
Online.init().then(() => { if ($('ovRank').classList.contains('on')) showRank(); });
requestAnimationFrame(frame);
})();
