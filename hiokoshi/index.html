<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120d0a">
<title>火おこしRTA</title>
<style>
:root{
  --bg:#120d0a; --panel:rgba(30,18,10,.92); --ink:#f6e7cf; --mute:#b79b78;
  --fire:#ff7a1a; --fire2:#ffc84a; --line:#5a3d26; --good:#9be564;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo","WenQuanYi Zen Hei",sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,75dvh);aspect-ratio:3/4;container-type:inline-size;background:#000;touch-action:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:0;right:0;top:0;padding:2.5cqw 3cqw;pointer-events:none;display:none}
#hud.on{display:block}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:2cqw}
#time{font-size:11cqw;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  text-shadow:0 .4cqw 0 #000a,0 0 3cqw #ff7a1a66}
#time small{font-size:4.5cqw;margin-left:1cqw;color:var(--mute)}
.btns{display:flex;gap:2cqw;pointer-events:auto}
.ib{width:9cqw;height:9cqw;border-radius:50%;border:.5cqw solid var(--line);background:#1e120acc;color:var(--ink);
  font-size:4.6cqw;display:grid;place-items:center;cursor:pointer;padding:0}
#gaugeWrap{margin-top:2cqw}
#gauge{position:relative;height:4.4cqw;border-radius:2.2cqw;background:#0008;border:.4cqw solid var(--line);overflow:hidden}
#gfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8a8a8a,#c98a3a 45%,#ff7a1a 75%,#ffd34d)}
#gauge i{position:absolute;top:0;bottom:0;width:.3cqw;background:#fff5}
#glabels{display:flex;margin-top:.8cqw;font-size:2.6cqw;color:var(--mute);position:relative;height:3.5cqw}
#glabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#hint{margin-top:1.5cqw;text-align:center;font-size:4cqw;font-weight:700;min-height:5cqw;color:var(--fire2);
  text-shadow:0 .3cqw 0 #000}
#combo{position:absolute;left:3cqw;bottom:3cqw;font-size:6cqw;font-weight:900;color:var(--good);
  text-shadow:0 .4cqw 0 #000;opacity:0;transition:opacity .15s}
#combo.on{opacity:1}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:2cqw 4cqw;
  background:radial-gradient(ellipse at 50% 40%,rgba(18,10,5,.78),rgba(8,4,2,.95))}
.ov.on{display:flex}
.card{width:100%;max-height:100%;overflow-y:auto;overscroll-behavior:contain;text-align:center;scrollbar-width:none;
  padding:5cqw 0;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 4cqw,#000 calc(100% - 4cqw),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 4cqw,#000 calc(100% - 4cqw),transparent 100%)}
.card::-webkit-scrollbar{display:none}
h1{margin:0;font-size:10cqw;line-height:1.05;font-weight:900;color:var(--fire2);
  text-shadow:0 .6cqw 0 #7a2a00,0 0 5cqw #ff7a1a88}
.sub{color:var(--mute);font-size:3.4cqw;margin:1cqw 0 2.5cqw}
.how{background:#00000055;border:.4cqw solid var(--line);border-radius:3cqw;padding:2.4cqw;
  text-align:left;font-size:3.2cqw;line-height:1.55;margin-bottom:2.5cqw}
.how b{color:var(--fire2)}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-bottom:2.5cqw}
.rec div,.stat div{background:#00000066;border:.4cqw solid var(--line);border-radius:2.4cqw;padding:2cqw 1cqw}
.rec small,.stat small{display:block;font-size:2.8cqw;color:var(--mute)}
.rec b,.stat b{font-size:4.8cqw;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:3cqw;padding:2.6cqw;margin-top:2cqw;font:inherit;
  font-size:4.6cqw;font-weight:900;color:#2a1000;cursor:pointer;
  background:linear-gradient(#ffd34d,#ff8a1f);box-shadow:0 1cqw 0 #8a3a00,0 2cqw 4cqw #0008}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .2cqw 0 #8a3a00}
.btn.sec{background:linear-gradient(#e8d5b5,#b99a6e);box-shadow:0 1cqw 0 #5a4326,0 2cqw 4cqw #0008}
.btn.share{background:linear-gradient(#7fd6ff,#2f8fe0);color:#001a2e;box-shadow:0 1cqw 0 #124a7a,0 2cqw 4cqw #0008}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
#rank{font-size:9cqw;font-weight:900;color:var(--fire2);text-shadow:0 .5cqw 0 #7a2a00;line-height:1.1}
#rtime{font-size:15cqw;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;margin:1cqw 0}
#rtime small{font-size:6cqw;color:var(--mute)}
#rscore{font-size:7cqw;font-weight:800;font-variant-numeric:tabular-nums}
#newbest{display:none;color:var(--good);font-weight:900;font-size:4cqw;margin-top:1cqw}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin:3cqw 0}
#total{margin-bottom:1cqw;font-size:4.4cqw;color:var(--mute)}
#total b{color:var(--ink);font-size:6cqw;font-variant-numeric:tabular-nums}
#preview{width:100%;border-radius:2cqw;border:.4cqw solid var(--line);margin-top:2cqw;display:block}
#nameRow{display:flex;gap:2cqw;align-items:center;margin-bottom:2cqw;font-size:3.4cqw;color:var(--mute)}
#nameRow input{flex:1;min-width:0;background:#00000066;border:.4cqw solid var(--line);border-radius:2.4cqw;padding:2cqw;color:var(--ink);font:inherit;font-size:4cqw}
#rrank{margin-top:1cqw;font-size:4.4cqw;font-weight:800;color:var(--good)}
.rk{list-style:none;margin:0 0 2cqw;padding:0;text-align:left}
.rk li{display:grid;grid-template-columns:9cqw 1fr auto;gap:2cqw;align-items:baseline;padding:2cqw 2.4cqw;margin-bottom:1.2cqw;
  background:#00000066;border:.4cqw solid var(--line);border-radius:2.4cqw;font-size:3.8cqw}
.rk li.me{border-color:var(--fire2);background:#ff7a1a33}
.rk b{font-variant-numeric:tabular-nums;font-size:4.4cqw}
.rk em{font-style:normal;color:var(--mute);font-size:3cqw;display:block}
.rk .n{color:var(--fire2);font-weight:900}
.empty{color:var(--mute);padding:6cqw 0}
.langrow{display:flex;justify-content:flex-end;margin-bottom:1cqw}
.ib.lang{width:auto;min-width:9cqw;padding:0 2.4cqw;border-radius:5cqw;font-size:3.4cqw;font-weight:800;color:var(--ink)}
#toast{position:absolute;left:50%;bottom:6cqw;transform:translateX(-50%);background:#000c;color:#fff;
  padding:2cqw 4cqw;border-radius:3cqw;font-size:3.6cqw;opacity:0;transition:opacity .25s;pointer-events:none;
  max-width:90%;text-align:center;z-index:5}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="row">
      <div id="time">0.00<small data-i="unit">秒</small></div>
      <div class="btns">
        <button class="ib lang" id="bLang2" aria-label="Language">EN</button>
        <button class="ib" id="bMute" aria-label="Sound">🔊</button>
        <button class="ib" id="bRetry" aria-label="Retry">↻</button>
      </div>
    </div>
    <div id="gaugeWrap">
      <div id="gauge"><div id="gfill"></div><i style="left:25%"></i><i style="left:55%"></i><i style="left:85%"></i></div>
      <div id="glabels"><span style="left:12.5%" data-i="gSt1">こする</span><span style="left:40%" data-i="gSt2">煙</span><span style="left:70%" data-i="gSt3">火種</span><span style="left:92.5%" data-i="gSt4">着火</span></div>
    </div>
    <div id="hint"></div>
  </div>
  <div id="combo"></div>

  <div class="ov on" id="ovTitle"><div class="card">
    <div class="langrow"><button class="ib lang" id="bLang" aria-label="Language">EN</button></div>
    <h1 data-h="title">火おこし<br>RTA</h1>
    <div class="sub" data-i="sub">原始人になって、木の棒で火をおこせ！</div>
    <div class="how" data-h="how"></div>
    <div class="rec">
      <div><small data-i="recTotal">トータル</small><b id="tTotal">0</b></div>
      <div><small data-i="recBest">ベスト</small><b id="tBest">-</b></div>
      <div><small data-i="recPlays">プレイ</small><b id="tPlays">0</b></div>
    </div>
    <div id="nameRow"><label for="pname" data-i="nameLabel">なまえ</label><input id="pname" maxlength="8" data-p="anon" autocomplete="off"></div>
    <button class="btn" id="bStart" data-i="start">スタート</button>
    <button class="btn sec" id="bRank" data-i="rankBtn">🏆 ランキング</button>
  </div></div>

  <div class="ov" id="ovRank"><div class="card">
    <h1 style="font-size:9cqw" data-i="rankBtn">🏆 ランキング</h1>
    <div class="sub" data-i="rankSub">この端末のベスト10（スコア順）</div>
    <ol class="rk" id="rkList"></ol>
    <button class="btn" id="bRankBack" data-i="back">もどる</button>
  </div></div>

  <div class="ov" id="ovResult"><div class="card">
    <div id="rank"></div>
    <div id="rtime"></div>
    <div id="rscore"></div>
    <div id="rrank"></div>
    <div id="newbest" data-i="newBest">🏆 ベスト更新！</div>
    <div class="stat">
      <div><small data-i="sAcc">正確さ</small><b id="sAcc"></b></div>
      <div><small data-i="sCombo">最大コンボ</small><b id="sCombo"></b></div>
      <div><small data-i="sN">こすった数</small><b id="sN"></b></div>
    </div>
    <div id="total"><span data-i="totalLbl">トータルスコア</span> <b id="rTotal"></b></div>
    <img id="preview" alt="share image">
    <button class="btn share" id="bShare" data-i="share">📷 画像つきでシェア</button>
    <div class="two">
      <button class="btn" id="bAgain" data-i="again">もう一回</button>
      <button class="btn sec" id="bHome" data-i="home">タイトル</button>
    </div>
    <button class="btn sec" id="bRank2" data-i="rank2">🏆 ランキングを見る</button>
  </div></div>

  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
// ───────── 定数 ─────────
const W = 720, H = 960;
const P = { x: 360, y: 790 };          // 棒の先が当たる点
const STICK_LEN = 600;
const REV = 14;                        // 反転とみなす戻り量(px)
const MIN_LEN = 36;                    // ストロークとみなす最小長(px)
const IDEAL_R = 0.7;                   // 理想の傾き(下/横)。約35°
const KEY = 'hiokoshi.v1';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);

// ───────── 記録 ─────────
function loadRec() {
  const d = { total: 0, best: 0, bestTime: 0, plays: 0, name: '', ranks: [], lang: '' };
  try { Object.assign(d, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  return d;
}
const rec = loadRec();
function saveRec() { try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch (e) {} }
const fmt = n => Math.round(n).toLocaleString('en-US');

// ───────── 言語 ─────────
const I18N = {
  ja: {
    unit: '秒', gSt1: 'こする', gSt2: '煙', gSt3: '火種', gSt4: '着火',
    title: '火おこし<br>RTA', sub: '原始人になって、木の棒で火をおこせ！',
    how: '画面を<b>ドラッグ</b>して棒をこする。<br><b>右下 ⇄ 左下</b>へ、<b>正確に・高速に・交互に</b>斜め下へこすり続けるほど煙が出て、早く火がつく！<br>ヨコすぎ・タテすぎ・バラバラだと熱が逃げる。',
    recTotal: 'トータル', recBest: 'ベスト', recPlays: 'プレイ', nameLabel: 'なまえ', anon: 'ななし',
    start: 'スタート', rankBtn: '🏆 ランキング', rankSub: 'この端末のベスト10（スコア順）', back: 'もどる',
    newBest: '🏆 ベスト更新！', sAcc: '正確さ', sCombo: '最大コンボ', sN: 'こすった数', totalLbl: 'トータルスコア',
    share: '📷 画像つきでシェア', again: 'もう一回', home: 'タイトル', rank2: '🏆 ランキングを見る',
    hReady: '棒を ジグザグに こすって スタート！', hIgnite: '🔥 着火！！', hStall: '斜め下へ 右・左・右・左…と 交互に！',
    h1: 'もっと速く こすれ！', h2: '煙が出てきた！', h3: 'おがくずに 火種が！', h4: 'もうすぐ着火！！',
    jBack: '戻し', jFlat: 'ヨコすぎ', jSteep: 'タテすぎ', jPerfect: 'PERFECT', jGood: 'GOOD', jOk: 'OK', jSloppy: 'ざつ',
    r0: '火の神', r1: '炎の達人', r2: '縄文の匠', r3: '石器時代の民', r4: 'たき火見習い', r5: 'まだ寒い',
    rrankIn: 'ランキング {0}位！', rrankOut: 'ランク圏外（10位まで）', empty: 'まだ記録がありません',
    rowInfo: '{0}秒 ・ 正確さ{1}% ・ {2}',
    cardTitle: '火おこしRTA', cardStats: '正確さ {0}% / 最大コンボ {1} / {2}ストローク', tag: '#火おこしRTA',
    shareText: '火おこしRTA 🔥 {0}秒で着火！ SCORE {1}（{2}） トータル {3} #火おこしRTA',
    tWait: '画像を作っています…もう一度押してね', tSaved: '画像を保存しました。投稿に添付してね',
    tCopied: '文面をコピーしました。画像は長押し/右クリックで保存して添付してね', langBtn: 'EN', docTitle: '火おこしRTA'
  },
  en: {
    unit: 's', gSt1: 'Rub', gSt2: 'Smoke', gSt3: 'Ember', gSt4: 'Fire',
    title: 'FIRE<br>STARTER RTA', sub: 'Be a caveman. Start a fire with a stick!',
    how: '<b>Drag</b> on the screen to rub the stick.<br>Rub <b>down-right ⇄ down-left</b> — <b>accurately, fast, alternating</b> — to make smoke and light the fire sooner!<br>Too flat, too steep, or sloppy strokes let the heat escape.',
    recTotal: 'Total', recBest: 'Best', recPlays: 'Plays', nameLabel: 'Name', anon: 'Anon',
    start: 'Start', rankBtn: '🏆 Ranking', rankSub: 'Top 10 on this device (by score)', back: 'Back',
    newBest: '🏆 New best!', sAcc: 'Accuracy', sCombo: 'Max combo', sN: 'Strokes', totalLbl: 'Total score',
    share: '📷 Share with image', again: 'Again', home: 'Title', rank2: '🏆 View ranking',
    hReady: 'Rub the stick in a zigzag to start!', hIgnite: '🔥 Ignited!!', hStall: 'Alternate down-right, down-left, down-right…',
    h1: 'Rub faster!', h2: 'Smoke is rising!', h3: 'An ember in the sawdust!', h4: 'Almost there!!',
    jBack: 'Reset', jFlat: 'Too flat', jSteep: 'Too steep', jPerfect: 'PERFECT', jGood: 'GOOD', jOk: 'OK', jSloppy: 'Sloppy',
    r0: 'God of Fire', r1: 'Flame Master', r2: 'Jomon Artisan', r3: 'Stone Age Folk', r4: 'Campfire Rookie', r5: 'Still Cold',
    rrankIn: 'Rank #{0}!', rrankOut: 'Not in the top 10', empty: 'No records yet',
    rowInfo: '{0}s ・ Acc {1}% ・ {2}',
    cardTitle: 'Fire Starter RTA', cardStats: 'Accuracy {0}% / Max combo {1} / {2} strokes', tag: '#FireStarterRTA',
    shareText: 'Fire Starter RTA 🔥 Lit in {0}s! SCORE {1} ({2}) Total {3} #FireStarterRTA',
    tWait: 'Making the image… tap again', tSaved: 'Image saved. Attach it to your post.',
    tCopied: 'Text copied. Long-press / right-click the image to save and attach it.', langBtn: '日本語', docTitle: 'Fire Starter RTA'
  }
};
let lang = rec.lang || ((navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en');
const t = (k, ...a) => {
  let v = (I18N[lang] && I18N[lang][k]) ?? I18N.ja[k] ?? k;
  a.forEach((x, i) => { v = v.replace('{' + i + '}', x); });
  return v;
};

// ───────── 画面サイズに合わせて枠を収める ─────────
const stageEl = $('stage');
function fit() {
  const vv = window.visualViewport;
  const w = Math.min(window.innerWidth, vv ? vv.width : 1e9);
  const h = Math.min(window.innerHeight, vv ? vv.height : 1e9);
  const sw = Math.max(120, Math.min(w, h * .75));
  stageEl.style.width = sw + 'px'; stageEl.style.height = sw / .75 + 'px';
}
fit();
window.addEventListener('resize', fit);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);

// ───────── Canvas ─────────
const cv = $('cv'), ctx = cv.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

// 背景は一度だけ描く
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function drawBG() {
  const c = bg.getContext('2d');
  let g = c.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, '#0b1230'); g.addColorStop(.55, '#3a2250'); g.addColorStop(1, '#c4673a');
  c.fillStyle = g; c.fillRect(0, 0, W, 600);
  for (let i = 0; i < 70; i++) {
    c.fillStyle = `rgba(255,255,255,${rnd(.2, .9)})`;
    c.fillRect(rnd(0, W), rnd(0, 330), 2, 2);
  }
  c.fillStyle = '#f4e9c8'; c.beginPath(); c.arc(610, 270, 34, 0, 7); c.fill();
  c.fillStyle = '#e1d4ac'; c.beginPath(); c.arc(600, 262, 8, 0, 7); c.fill();
  c.fillStyle = '#2a1a3a';
  c.beginPath(); c.moveTo(0, 520);
  for (let x = 0; x <= W; x += 40) c.lineTo(x, 470 + Math.sin(x * .013) * 40 + Math.sin(x * .05) * 12);
  c.lineTo(W, 600); c.lineTo(0, 600); c.fill();
  c.fillStyle = '#1b1022';
  c.beginPath(); c.moveTo(0, 560);
  for (let x = 0; x <= W; x += 30) c.lineTo(x, 540 + Math.sin(x * .02 + 2) * 26);
  c.lineTo(W, 620); c.lineTo(0, 620); c.fill();
  g = c.createLinearGradient(0, 580, 0, H);
  g.addColorStop(0, '#4a3220'); g.addColorStop(1, '#1d120b');
  c.fillStyle = g; c.fillRect(0, 580, W, H - 580);
  for (let i = 0; i < 260; i++) {
    c.fillStyle = `rgba(${rnd(60, 110) | 0},${rnd(40, 70) | 0},${rnd(20, 40) | 0},${rnd(.3, .7)})`;
    const y = rnd(600, H);
    c.fillRect(rnd(0, W), y, rnd(2, 7) * (y / 600), 2);
  }
})();

// おがくず・草は一度だけ配置
const specks = Array.from({ length: 150 }, () => {
  const a = rnd(0, Math.PI * 2), r = 6 + Math.pow(Math.random(), 1.4) * 92;
  return {
    x: P.x + Math.cos(a) * r, y: P.y + 4 + Math.sin(a) * r * .22,
    s: rnd(1.4, 3.6), sh: rnd(0, 1), glow: Math.hypot(Math.cos(a) * r, Math.sin(a) * r * .22) < 44 ? rnd(0, 1) : 2
  };
});
const blades = [];
for (const side of [-1, 1]) for (let i = 0; i < 34; i++) {
  const off = 52 + Math.pow(Math.random(), .8) * 120;
  blades.push({
    x: P.x + side * off, y: P.y - 6 + rnd(-6, 8), h: rnd(34, 74), lean: -side * rnd(8, 40) + rnd(-10, 10),
    ph: rnd(0, 6.28), c: Math.random() < .5 ? '#c9a74d' : '#a88a3a'
  });
}

// ───────── ゲーム状態 ─────────
let mode = 'title';     // title | ready | play | ignite | result
let T = 0;              // 熱 0..100
let tStart = 0, tEnd = 0, igniteAt = 0, elapsed = 0;
let n = 0, qSum = 0, combo = 0, maxCombo = 0, lastL = 0;
let spin = 0, rubSpeed = 0, depth = 0, depthVis = 0, palmShift = 0, shake = 0, clock = 0;
let stalled = 0;
let result = null, shareBlob = null, shareUrl = null;

const smoke = [], sparks = [], flames = [], dust = [], floaters = [];

function resetRun() {
  T = 0; n = 0; qSum = 0; combo = 0; maxCombo = 0; lastL = 0; elapsed = 0; stalled = 0;
  depth = 0; depthVis = 0;
  smoke.length = sparks.length = flames.length = dust.length = floaters.length = 0;
  tr = null; result = null;
  $('time').firstChild.nodeValue = '0.00';
  setHint('');
}

// ───────── 入力：ストローク検出 ─────────
let down = false, px = 0, py = 0, pt = 0, tr = null, startX = 0;

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  if (mode !== 'ready' && mode !== 'play') return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  initAudio();
  const p = toLogical(e);
  down = true; px = startX = p.x; py = p.y; pt = e.timeStamp; tr = null;
});
cv.addEventListener('pointermove', e => {
  if (!down) return;
  e.preventDefault();
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  for (const ev of (list && list.length ? list : [e])) {
    const p = toLogical(ev);
    onMove(p.x, p.y, ev.timeStamp);
  }
});
const up = () => { down = false; tr = null; };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('lostpointercapture', up);

function onMove(x, y, t) {
  if (mode !== 'ready' && mode !== 'play') return;
  const dx = x - px, dt = Math.max(1, t - pt);
  px = x; py = y; pt = t;
  spin += dx * 0.09;
  palmShift = clamp(palmShift + dx * .15, -22, 22);
  rubSpeed = Math.max(rubSpeed, Math.min(2, Math.abs(dx) / dt));
  if (mode === 'ready' && Math.abs(x - startX) > 8) startRun();
  if (!tr) { tr = { dir: 0, sx: x, sy: y, st: t, ex: x, ey: y, et: t }; return; }
  if (tr.dir === 0) {
    if (Math.abs(x - tr.sx) > REV) { tr.dir = Math.sign(x - tr.sx); tr.ex = x; tr.ey = y; tr.et = t; }
    return;
  }
  if ((x - tr.ex) * tr.dir >= 0) { tr.ex = x; tr.ey = y; tr.et = t; }
  else if ((tr.ex - x) * tr.dir > REV) {
    const nd = -tr.dir;
    commit(tr);
    if (mode !== 'play') return;
    tr = { dir: nd, sx: tr.ex, sy: tr.ey, st: tr.et, ex: x, ey: y, et: t };
  }
}

function startRun() {
  mode = 'play'; tStart = performance.now(); stalled = 0;
}

// 1ストロークの評価 → 熱に変換
function commit(s) {
  if (mode !== 'play') return;
  const L = Math.abs(s.ex - s.sx), dy = s.ey - s.sy;
  if (L < MIN_LEN) return;
  const r = dy / L;                                   // 下向き成分の比
  const dt = Math.max(24, s.et - s.st);
  const v = L / dt;                                   // px/ms
  if (r < -0.35) { floatText(t('jBack'), 'rgba(200,200,200,.9)'); return; }   // 持ち替えの上向き動作
  const accA = clamp(1 - Math.abs(r - IDEAL_R) / 0.8, 0, 1);              // 斜め下の正確さ
  const ratio = lastL ? Math.min(L, lastL) / Math.max(L, lastL) : 1;
  const cons = clamp((ratio - .4) / .5, 0, 1);                             // 長さの安定
  const q = accA * (0.7 + 0.3 * cons);
  lastL = L;
  const spd = clamp(v / 0.8, 0.15, 1.5);
  const lenF = clamp(L / 90, 0.4, 1.3);
  if (q >= .5) { combo++; maxCombo = Math.max(maxCombo, combo); } else if (q < .3) combo = 0;
  const mult = 1 + Math.min(combo, 24) * 0.035;
  const gain = 5.4 * q * spd * lenF * mult;
  n++; qSum += q;
  T = Math.min(100, T + gain);
  depth += clamp(dy, 0, 200) / 900;
  if (depth >= 1) depth -= 1, depthVis = -.15;
  shake = Math.min(1, shake + .35);
  // 判定表示
  let txt, col;
  if (r < 0.2) { txt = t('jFlat'); col = '#ff9a7a'; }
  else if (r > 1.5) { txt = t('jSteep'); col = '#ff9a7a'; }
  else if (q >= .85) { txt = t('jPerfect'); col = '#ffe066'; }
  else if (q >= .6) { txt = t('jGood'); col = '#9be564'; }
  else if (q >= .3) { txt = t('jOk'); col = '#d9d9d9'; }
  else { txt = t('jSloppy'); col = '#ff9a7a'; }
  floatText(txt, col);
  // おがくず
  for (let i = 0; i < 4; i++) dust.push({
    x: P.x + rnd(-6, 6), y: P.y, vx: s.dir * rnd(30, 110) * -1 + rnd(-30, 30), vy: rnd(-90, -20),
    life: rnd(.35, .7), age: 0, s: rnd(1.5, 3)
  });
  stalled = 0;
  if (T >= 100) ignite();
}

function floatText(text, color) {
  for (const f of floaters) f.ty -= 50;          // 古い表示は押し上げて、少し残す
  floaters.push({ text, color, x: P.x, y: 430, ty: 430, age: 0, life: 1.1 });
  if (floaters.length > 3) floaters.shift();
}

function ignite() {
  mode = 'ignite'; down = false; tr = null;
  tEnd = performance.now(); elapsed = (tEnd - tStart) / 1000; igniteAt = tEnd;
  boom();
  setTimeout(showResult, 2300);
}

// ───────── スコア ─────────
const RANKS = [[6500, '🔥', 'r0'], [5000, '🌋', 'r1'], [3500, '🪨', 'r2'], [2000, '🏹', 'r3'], [800, '🍂', 'r4'], [0, '🥶', 'r5']];
function calcScore(t, acc) {
  const timeScore = 10000 * Math.exp(-t / 7);
  return Math.round(timeScore * (0.6 + 0.4 * acc));
}
const rankIdx = s => RANKS.findIndex(r => s >= r[0]);
const rankName = i => RANKS[i][1] + ' ' + t(RANKS[i][2]);

function renderResultText() {
  if (!result) return;
  const r = result;
  $('rrank').textContent = r.pos && r.pos <= 10 ? t('rrankIn', r.pos) : t('rrankOut');
  $('rank').textContent = rankName(r.ri);
  $('rtime').innerHTML = r.t.toFixed(2) + '<small> ' + t('unit') + '</small>';
  $('rscore').textContent = 'SCORE ' + fmt(r.score);
  $('newbest').style.display = r.isBest ? 'block' : 'none';
  $('sAcc').textContent = Math.round(r.acc * 100) + '%';
  $('sCombo').textContent = r.combo;
  $('sN').textContent = r.n;
  $('rTotal').textContent = fmt(r.total);
}
function makeCard() {
  shareBlob = null;
  $('preview').removeAttribute('src');
  renderCard(result).then(blob => {
    shareBlob = blob;
    if (shareUrl) URL.revokeObjectURL(shareUrl);
    shareUrl = URL.createObjectURL(blob);
    $('preview').src = shareUrl;
  });
}
function showResult() {
  if (mode !== 'ignite') return;
  mode = 'result';
  const acc = n ? qSum / n : 0;
  const score = calcScore(elapsed, acc);
  const isBest = score > rec.best;
  rec.total += score; rec.plays++;
  if (isBest) { rec.best = score; rec.bestTime = elapsed; }
  const entry = { s: score, t: elapsed, a: acc, n: rec.name || t('anon'), d: Date.now() };
  rec.ranks = (rec.ranks || []).concat(entry).sort((a, b) => b.s - a.s || a.d - b.d);
  const pos = rec.ranks.indexOf(entry) + 1;
  rec.ranks = rec.ranks.slice(0, 10);
  saveRec();
  result = { d: entry.d, t: elapsed, score, acc, combo: maxCombo, n, ri: rankIdx(score), pos, total: rec.total, isBest };
  renderResultText();
  $('hud').classList.remove('on'); $('combo').classList.remove('on');
  $('ovResult').classList.add('on');
  makeCard();
}

// ───────── シェア画像 ─────────
const FONT = '"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo","WenQuanYi Zen Hei",sans-serif';
function flameShape(c, x, y, s, fill) {
  c.fillStyle = fill; c.beginPath();
  c.moveTo(x, y - 150 * s);
  c.bezierCurveTo(x + 30 * s, y - 100 * s, x + 80 * s, y - 50 * s, x + 62 * s, y - 8 * s);
  c.bezierCurveTo(x + 50 * s, y + 22 * s, x - 50 * s, y + 22 * s, x - 62 * s, y - 8 * s);
  c.bezierCurveTo(x - 80 * s, y - 50 * s, x - 20 * s, y - 80 * s, x, y - 150 * s);
  c.fill();
}
function renderCard(r) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 630;
  const g = c.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 630);
  gr.addColorStop(0, '#0b1230'); gr.addColorStop(.6, '#3a2250'); gr.addColorStop(1, '#8a3a1a');
  g.fillStyle = gr; g.fillRect(0, 0, 1200, 630);
  for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(255,255,255,${rnd(.2, .8)})`; g.fillRect(rnd(0, 1200), rnd(0, 300), 2, 2); }
  gr = g.createRadialGradient(290, 420, 10, 290, 420, 330);
  gr.addColorStop(0, 'rgba(255,160,60,.55)'); gr.addColorStop(1, 'rgba(255,120,20,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 600, 630);
  // 地面と板
  g.fillStyle = '#2a1a10'; g.fillRect(0, 520, 1200, 110);
  g.fillStyle = '#7a5230'; g.fillRect(90, 500, 400, 40);
  g.fillStyle = '#5a3a20'; g.fillRect(90, 540, 400, 30);
  // 棒
  g.save(); g.translate(290, 500); g.rotate(.08);
  g.fillStyle = '#9a7040'; g.fillRect(-9, -300, 18, 300);
  g.fillStyle = '#c29a62'; g.fillRect(-9, -300, 6, 300);
  g.restore();
  // 炎
  g.globalCompositeOperation = 'lighter';
  flameShape(g, 290, 495, 1.75, '#c2310a');
  flameShape(g, 290, 495, 1.35, '#ff8a1a');
  flameShape(g, 290, 495, .85, '#ffe27a');
  g.globalCompositeOperation = 'source-over';
  // 文字
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.fillStyle = '#ffc84a'; g.font = `900 70px ${FONT}`;
  g.shadowColor = '#7a2a00'; g.shadowOffsetY = 5; g.shadowBlur = 0;
  g.fillText(t('cardTitle'), 560, 100);
  g.shadowColor = 'transparent';
  g.fillStyle = '#f6e7cf';
  g.font = `900 150px ${FONT}`; g.fillText(r.t.toFixed(2), 560, 270);
  const tw = g.measureText(r.t.toFixed(2)).width;
  g.font = `700 48px ${FONT}`; g.fillStyle = '#b79b78'; g.fillText(t('unit'), 560 + tw + 12, 270);
  g.fillStyle = '#f6e7cf'; g.font = `800 64px ${FONT}`; g.fillText('SCORE ' + fmt(r.score), 560, 360);
  g.fillStyle = '#ffc84a'; g.font = `900 58px ${FONT}`; g.fillText(rankName(r.ri), 560, 435);
  g.fillStyle = '#d6bf9c'; g.font = `600 30px ${FONT}`;
  g.fillText(t('cardStats', Math.round(r.acc * 100), r.combo, r.n), 560, 495);
  g.fillStyle = '#f6e7cf'; g.font = `800 42px ${FONT}`;
  g.fillText('TOTAL ' + fmt(r.total), 560, 560);
  g.fillStyle = '#b79b78'; g.font = `600 28px ${FONT}`; g.textAlign = 'right';
  g.fillText(t('tag'), 1160, 595);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

async function doShare() {
  if (!result) return;
  const text = t('shareText', result.t.toFixed(2), fmt(result.score), t(RANKS[result.ri][2]), fmt(result.total));
  const url = /^https?:/.test(location.protocol) ? location.href : '';
  if (!shareBlob) { toast(t('tWait')); return; }
  const file = new File([shareBlob], 'hiokoshi-rta.png', { type: 'image/png' });
  const data = { title: t('docTitle'), text, files: [file] };
  if (url) data.url = url;
  if (navigator.canShare && navigator.canShare(data)) {
    try { await navigator.share(data); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  // フォールバック：画像を保存して X の投稿画面を開く
  const a = document.createElement('a');
  a.href = shareUrl; a.download = 'hiokoshi-rta.png';
  document.body.appendChild(a); a.click(); a.remove();
  const intent = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + (url ? '&url=' + encodeURIComponent(url) : '');
  window.open(intent, '_blank', 'noopener');
  toast(t('tSaved'));
}

let toastTimer;
function toast(s) {
  const t = $('toast'); t.textContent = s; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

// ───────── 音 ─────────
let ac, rubGain, rubFilter, muted = false, noiseBuf;
function initAudio() {
  if (ac || muted) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    rubFilter = ac.createBiquadFilter(); rubFilter.type = 'bandpass'; rubFilter.frequency.value = 800; rubFilter.Q.value = .9;
    rubGain = ac.createGain(); rubGain.gain.value = 0;
    src.connect(rubFilter); rubFilter.connect(rubGain); rubGain.connect(ac.destination); src.start();
  } catch (e) { ac = null; }
}
function audioFrame() {
  if (!ac || !rubGain) return;
  const on = !muted && down && (mode === 'play' || mode === 'ready');
  rubGain.gain.setTargetAtTime(on ? Math.min(.45, rubSpeed * .3) : 0, ac.currentTime, .03);
  rubFilter.frequency.setTargetAtTime(500 + rubSpeed * 700 + T * 8, ac.currentTime, .05);
}
function burst(delay, dur, freq, vol, type) {
  if (!ac || muted) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq;
  const g = ac.createGain(); const t0 = ac.currentTime + delay;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t0, Math.random()); s.stop(t0 + dur + .05);
}
function boom() {
  burst(0, .6, 400, .5, 'lowpass');
  for (let i = 0; i < 18; i++) burst(.1 + i * .11 + Math.random() * .08, .05, 2000 + Math.random() * 3000, .12);
}

// ───────── 描画 ─────────
function drawBoard() {
  // 上面
  let g = ctx.createLinearGradient(0, 765, 0, 810);
  g.addColorStop(0, '#a87a48'); g.addColorStop(1, '#8a5f34');
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(160, 768); ctx.lineTo(560, 768); ctx.lineTo(610, 808); ctx.lineTo(110, 808); ctx.fill();
  // 前面
  ctx.fillStyle = '#5e3d20'; ctx.fillRect(110, 808, 500, 48);
  ctx.fillStyle = '#4a2f18'; ctx.fillRect(110, 848, 500, 8);
  ctx.strokeStyle = 'rgba(40,20,8,.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(130 + i * 55, 770 + (i % 2) * 6); ctx.lineTo(120 + i * 58, 806); ctx.stroke(); }
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(115, 815 + i * 8); ctx.lineTo(605, 815 + i * 8 + (i % 2)); ctx.stroke(); }
  // 焦げ跡とV字の切り欠き
  const burn = clamp(T / 100, 0, 1);
  g = ctx.createRadialGradient(P.x, P.y + 4, 2, P.x, P.y + 4, 22 + burn * 26);
  g.addColorStop(0, `rgba(10,4,0,${.55 + burn * .4})`); g.addColorStop(1, 'rgba(10,4,0,0)');
  ctx.fillStyle = g; ctx.fillRect(P.x - 60, P.y - 30, 120, 60);
  ctx.fillStyle = '#120802'; ctx.beginPath();
  ctx.moveTo(P.x - 14, 808); ctx.lineTo(P.x, P.y - 2); ctx.lineTo(P.x + 14, 808); ctx.fill();
}
function drawSawdust() {
  const act = clamp((T - 40) / 60, 0, 1);
  for (const s of specks) {
    let col;
    if (s.glow < 1 && T > 35 + s.glow * 45) {
      col = `rgb(${200 + 55 * act | 0},${70 + 80 * act * s.sh | 0},20)`;
    } else {
      const b = 70 + s.sh * 60 | 0; col = `rgb(${b + 40},${b},${b * .6 | 0})`;
    }
    ctx.fillStyle = col; ctx.fillRect(s.x, s.y, s.s, s.s * .8);
  }
}
function drawGrass(burnt) {
  ctx.lineCap = 'round';
  for (const b of blades) {
    const sw = Math.sin(clock * 1.6 + b.ph) * 2 + (mode === 'ignite' || mode === 'result' ? Math.sin(clock * 9 + b.ph) * 4 : 0);
    const k = clamp(burnt, 0, 1);
    ctx.strokeStyle = k > 0 ? `rgb(${lerp(201, 30, k) | 0},${lerp(167, 18, k) | 0},${lerp(77, 10, k) | 0})` : b.c;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x, b.y);
    ctx.quadraticCurveTo(b.x + b.lean * .2, b.y - b.h * .6, b.x + b.lean + sw, b.y - b.h * (1 - k * .5));
    ctx.stroke();
  }
}
function drawStick() {
  const tilt = Math.sin(clock * 40) * .004 * shake + palmShift * 0.0012;
  const half = 14;
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(tilt);
  const handY = -(190 + (1 - depthVis) * 240);
  // 背側の手
  const ph = Math.sin(spin);
  drawPalm(-ph * 24 - 4, handY, true);
  // 棒本体
  let g = ctx.createLinearGradient(-half, 0, half, 0);
  g.addColorStop(0, '#6a4524'); g.addColorStop(.35, '#c79a5f'); g.addColorStop(.7, '#a8794a'); g.addColorStop(1, '#5a3a1e');
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(-6, 0); ctx.lineTo(-half, -40); ctx.lineTo(-half + 1, -STICK_LEN); ctx.lineTo(half - 1, -STICK_LEN); ctx.lineTo(half, -40); ctx.lineTo(6, 0);
  ctx.fill();
  // 回転がわかる螺旋の筋
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    for (let y = 0; y > -STICK_LEN; y -= 24) {
      const a1 = spin + i * Math.PI / 3 + y * .012, a2 = spin + i * Math.PI / 3 + (y - 24) * .012;
      const vis = Math.cos(a1);
      if (vis <= 0) continue;
      ctx.strokeStyle = `rgba(50,28,10,${vis * .6})`;
      ctx.beginPath(); ctx.moveTo(Math.sin(a1) * (half - 2), y); ctx.lineTo(Math.sin(a2) * (half - 2), y - 24); ctx.stroke();
    }
  }
  // 先端のこげ
  const hot = clamp(T / 100, 0, 1);
  g = ctx.createLinearGradient(0, 0, 0, -50);
  g.addColorStop(0, `rgba(${40 + hot * 200 | 0},${14 + hot * 40 | 0},0,.95)`); g.addColorStop(1, 'rgba(40,14,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-half, -50, half * 2, 50);
  // 手前の手
  drawPalm(ph * 24 + 4, handY + 14, false);
  ctx.restore();
}
function drawPalm(x, y, back) {
  ctx.fillStyle = back ? '#a8704a' : '#d79a6c';
  ctx.strokeStyle = '#6a3d22'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x - 20, y - 48, 40, 96, 16); ctx.fill(); ctx.stroke();
  if (!back) {
    ctx.strokeStyle = 'rgba(106,61,34,.6)';
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x - 20, y - 48 + i * 24); ctx.lineTo(x + 20, y - 48 + i * 24); ctx.stroke(); }
  }
}

function spawnFlame() {
  const b = blades[(Math.random() * blades.length) | 0];
  flames.push({ x: b.x + b.lean * .5 + rnd(-8, 8), y: b.y - b.h * .3, vx: rnd(-14, 14), vy: rnd(-90, -190), age: 0, life: rnd(.5, 1.1), s: rnd(14, 30) });
}
function updateParticles(dt) {
  const act = clamp(rubSpeed, 0, 1);
  // 煙
  const sRate = T > 8 ? clamp((T - 8) / 92, 0, 1) * (8 + 40 * act) : 0;
  if (mode === 'play' || mode === 'ready' || mode === 'ignite') {
    let k = sRate * dt;
    while (k > 0) {
      if (Math.random() < k) smoke.push({ x: P.x + rnd(-8, 8), y: P.y - 6, vx: rnd(-14, 14), vy: rnd(-40, -85), age: 0, life: rnd(1.8, 3.4), s: rnd(8, 14), ph: rnd(0, 6) });
      k--;
    }
  }
  for (let i = smoke.length - 1; i >= 0; i--) {
    const p = smoke[i]; p.age += dt;
    if (p.age > p.life) { smoke.splice(i, 1); continue; }
    p.x += (p.vx + Math.sin(clock * 2 + p.ph) * 14) * dt; p.y += p.vy * dt; p.vy *= (1 - .25 * dt);
  }
  // 火の粉
  if (T > 55 && mode !== 'result') {
    let k = clamp((T - 55) / 45, 0, 1) * 26 * dt;
    while (k > 0) { if (Math.random() < k) sparks.push({ x: P.x + rnd(-14, 14), y: P.y - 6, vx: rnd(-40, 40), vy: rnd(-70, -150), age: 0, life: rnd(.5, 1.1) }); k--; }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.age += dt;
    if (p.age > p.life) { sparks.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt;
  }
  // おがくず
  for (let i = dust.length - 1; i >= 0; i--) {
    const p = dust[i]; p.age += dt;
    if (p.age > p.life) { dust.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt;
  }
  // 炎
  if (mode === 'ignite' || mode === 'result') {
    const ia = Math.min(1, (performance.now() - igniteAt) / 900);
    let k = (30 + 150 * ia) * dt;
    while (k > 0) { if (Math.random() < k) spawnFlame(); k--; }
  }
  for (let i = flames.length - 1; i >= 0; i--) {
    const p = flames[i]; p.age += dt;
    if (p.age > p.life) { flames.splice(i, 1); continue; }
    p.x += (p.vx + Math.sin(clock * 12 + p.y * .05) * 18) * dt; p.y += p.vy * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.age += dt; f.y += (f.ty - f.y) * Math.min(1, dt * 14);
    if (f.age > f.life) floaters.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of smoke) {
    const k = p.age / p.life, r = p.s + k * 40;
    const dark = clamp((T - 40) / 60, 0, 1);
    const c = 190 - dark * 90 | 0;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    const a = (1 - k) * Math.min(1, k * 6) * (.28 + clamp(T / 100, 0, 1) * .22);
    g.addColorStop(0, `rgba(${c},${c},${c + 10},${a})`); g.addColorStop(1, `rgba(${c},${c},${c + 10},0)`);
    ctx.fillStyle = g; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
  }
  ctx.fillStyle = '#6b4a2b';
  for (const p of dust) ctx.fillRect(p.x, p.y, p.s, p.s);
  ctx.globalCompositeOperation = 'lighter';
  for (const p of sparks) {
    const a = 1 - p.age / p.life;
    ctx.fillStyle = `rgba(255,${150 + 80 * a | 0},60,${a})`; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  for (const p of flames) {
    const k = p.age / p.life, r = p.s * (1 - k * .7);
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, `rgba(255,${230 - k * 120 | 0},${120 - k * 100 | 0},${.8 * (1 - k)})`);
    g.addColorStop(.5, `rgba(255,${120 - k * 60 | 0},20,${.5 * (1 - k)})`);
    g.addColorStop(1, 'rgba(200,40,0,0)');
    ctx.fillStyle = g; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawGlow() {
  const heat = clamp((T - 40) / 60, 0, 1);
  const fl = (mode === 'ignite' || mode === 'result') ? Math.min(1, (performance.now() - igniteAt) / 700) : 0;
  const a = Math.max(heat * .8, fl);
  if (a <= 0) return;
  ctx.globalCompositeOperation = 'lighter';
  const r = 30 + heat * 50 + fl * 380;
  const g = ctx.createRadialGradient(P.x, P.y - 6, 0, P.x, P.y - 6, r);
  g.addColorStop(0, `rgba(255,140,40,${a * (.7 + Math.sin(clock * 14) * .15)})`);
  g.addColorStop(1, 'rgba(255,90,10,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}
function drawGuide() {
  if (mode !== 'ready') return;
  const p = (Math.sin(clock * 5) + 1) / 2;
  ctx.save(); ctx.globalAlpha = .55 + p * .4;
  ctx.strokeStyle = '#ffe066'; ctx.fillStyle = '#ffe066'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = [[-130, 250], [130, 340], [-130, 430], [130, 520]];
  ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(P.x + q[0], q[1]) : ctx.moveTo(P.x + q[0], q[1])); ctx.stroke();
  const e = pts[3], s = pts[2];
  const a = Math.atan2(e[1] - s[1], e[0] - s[0]);
  ctx.beginPath(); ctx.moveTo(P.x + e[0], e[1]);
  ctx.lineTo(P.x + e[0] - Math.cos(a - .5) * 30, e[1] - Math.sin(a - .5) * 30);
  ctx.lineTo(P.x + e[0] - Math.cos(a + .5) * 30, e[1] - Math.sin(a + .5) * 30); ctx.fill();
  ctx.restore();
}
function drawFloaters() {
  ctx.textAlign = 'center'; ctx.font = `900 44px ${FONT}`; ctx.lineWidth = 7; ctx.lineJoin = 'round';
  for (const f of floaters) {
    ctx.globalAlpha = clamp((1 - f.age / f.life) * 2.2, 0, 1); ctx.strokeStyle = '#000'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(bg, 0, 0);
  const burnt = (mode === 'ignite' || mode === 'result') ? (performance.now() - igniteAt) / 3000 : 0;
  ctx.save();
  if (shake > 0) ctx.translate(Math.sin(clock * 90) * shake * 1.5, 0);
  drawBoard(); drawSawdust(); drawGrass(burnt); drawStick();
  ctx.restore();
  drawGlow(); drawParticles(); drawGuide(); drawFloaters();
}

// ───────── HUD ─────────
let lastHint = '';
function setHint(s) { if (s !== lastHint) { $('hint').textContent = s; lastHint = s; } }
function updateHud() {
  $('time').firstChild.nodeValue = elapsed.toFixed(2);
  $('gfill').style.width = T + '%';
  const cb = $('combo');
  if (combo >= 3 && mode === 'play') { cb.textContent = combo + ' COMBO'; cb.classList.add('on'); } else cb.classList.remove('on');
  let h;
  if (mode === 'ready') h = t('hReady');
  else if (mode === 'ignite') h = t('hIgnite');
  else if (stalled > 2.5 && T < 60) h = t('hStall');
  else if (T < 25) h = t('h1');
  else if (T < 55) h = t('h2');
  else if (T < 85) h = t('h3');
  else h = t('h4');
  setHint(h);
}

// ───────── ループ ─────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  if (mode === 'play') {
    elapsed = (now - tStart) / 1000;
    T = Math.max(0, T - (1.0 + .04 * T) * dt);
    stalled += dt;
    if (T < 0.5 && elapsed > 90) elapsed = 99.99;
  }
  rubSpeed *= Math.exp(-dt * 7);
  shake = Math.max(0, shake - dt * 4);
  depthVis = lerp(depthVis, depth, 1 - Math.exp(-dt * 20));
  if (depth < depthVis - .5) depthVis = depth;
  updateParticles(dt);
  render();
  if (mode === 'play' || mode === 'ready' || mode === 'ignite') updateHud();
  audioFrame();
  requestAnimationFrame(frame);
}

// ───────── 画面遷移 ─────────
function showRank(hl) {
  const ul = $('rkList'); ul.textContent = '';
  const list = rec.ranks || [];
  if (!list.length) { ul.innerHTML = '<div class="empty">' + t('empty') + '</div>'; return; }
  list.forEach((e, i) => {
    const li = document.createElement('li');
    if (hl && e.d === hl) li.className = 'me';
    const d = new Date(e.d);
    li.innerHTML = `<span class="n">${i + 1}</span><span></span><b>${fmt(e.s)}</b>`;
    const mid = li.children[1];
    mid.textContent = e.n;
    const em = document.createElement('em');
    em.textContent = t('rowInfo', e.t.toFixed(2), Math.round(e.a * 100), (d.getMonth() + 1) + '/' + d.getDate());
    mid.appendChild(em);
    ul.appendChild(li);
  });
}
function refreshTitle() {
  $('pname').value = rec.name || '';
  $('tTotal').textContent = fmt(rec.total);
  $('tBest').textContent = rec.best ? fmt(rec.best) : '-';
  $('tPlays').textContent = rec.plays;
}
function toReady() {
  resetRun(); down = false;
  mode = 'ready';
  $('ovTitle').classList.remove('on'); $('ovResult').classList.remove('on');
  $('hud').classList.add('on');
}
function toTitle() {
  mode = 'title'; resetRun(); refreshTitle();
  $('hud').classList.remove('on'); $('ovResult').classList.remove('on'); $('ovTitle').classList.add('on');
}
$('pname').addEventListener('input', e => { rec.name = e.target.value.trim().slice(0, 8); saveRec(); });
let rankFrom = 'ovTitle';
function openRank(from, hl) { rankFrom = from; showRank(hl); $(from).classList.remove('on'); $('ovRank').classList.add('on'); }
$('bRank').onclick = () => openRank('ovTitle');
$('bRank2').onclick = () => openRank('ovResult', result && result.d);
$('bRankBack').onclick = () => { $('ovRank').classList.remove('on'); $(rankFrom).classList.add('on'); };
$('bStart').onclick = () => { initAudio(); toReady(); };
$('bAgain').onclick = toReady;
$('bRetry').onclick = toReady;
$('bHome').onclick = toTitle;
$('bShare').onclick = doShare;
$('bMute').onclick = () => {
  muted = !muted; $('bMute').textContent = muted ? '🔇' : '🔊';
  if (!muted) initAudio();
};
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.querySelectorAll('[data-i]').forEach(e => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll('[data-h]').forEach(e => { e.innerHTML = t(e.dataset.h); });
  document.querySelectorAll('[data-p]').forEach(e => { e.placeholder = t(e.dataset.p); });
  document.querySelectorAll('.lang').forEach(e => { e.textContent = t('langBtn'); });
  lastHint = '';
  if ($('ovRank').classList.contains('on')) showRank(result && result.d);
  if (result && mode === 'result') { renderResultText(); makeCard(); }
}
function toggleLang() { lang = lang === 'ja' ? 'en' : 'ja'; rec.lang = lang; saveRec(); applyLang(); }
$('bLang').onclick = toggleLang;
$('bLang2').onclick = toggleLang;
document.addEventListener('contextmenu', e => e.preventDefault());

// テスト・デバッグ用
window.__hioko = { get T() { return T; }, get mode() { return mode; }, get result() { return result; } };

refreshTitle();
applyLang();
requestAnimationFrame(frame);
})();
</script>
